name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh public study notes; GitHub may delay scheduled workflows.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout study notes
        uses: actions/checkout@v4
        with:
          repository: Petooooo/systems-notes
          ref: main
          path: .external/systems-notes
          persist-credentials: false

      - name: Validate study notes
        run: python3 .external/systems-notes/scripts/validate-notes.py

      - name: Import reviewed public notes
        run: python3 automation/scripts/sync-systems-notes.py .external/systems-notes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
        env:
          SITE_URL: https://petooooo.github.io/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
