<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="a b"><title id="a">TFLM partial overlap constraint</title><desc id="b">Input tensor A and output tensor B may reuse consumed input bytes, but may not overwrite values still needed by the operator.</desc><rect width="980" height="380" rx="12" fill="#111b25"/><g font-family="Arial,sans-serif" fill="#ecf6ff"><text x="30" y="46" font-size="24" font-weight="bold">Input / output buffer reuse</text><text x="30" y="75" font-size="15" fill="#b9c9d7">Redrawn from the original TFLite Micro report · conflict boundary</text><text x="45" y="133" font-size="18">Input A</text><text x="45" y="241" font-size="18">Output B</text><text x="45" y="350" font-size="14" fill="#a8bbcd">Only already-consumed input bytes can be reused during operator execution.</text></g><rect x="178" y="104" width="745" height="86" rx="6" fill="#264e72"/><rect x="178" y="104" width="283" height="86" rx="6" fill="#2a8d70"/><path d="M461 104V190" stroke="#d8f7ff" stroke-width="3" stroke-dasharray="8 6"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#ffffff"><text x="318" y="145" font-size="18">Consumed</text><text x="318" y="169" font-size="13">reusable region</text><text x="691" y="145" font-size="18">Still required</text><text x="691" y="169" font-size="13">must be preserved</text></g><rect x="178" y="219" width="272" height="67" rx="6" fill="#3baf8a"/><text x="314" y="259" text-anchor="middle" font-size="18" fill="white" font-family="Arial,sans-serif">Output B</text><path d="M461 212V301" stroke="#7ebbd7" stroke-width="2" stroke-dasharray="5 5"/><text x="478" y="310" fill="#9bc7da" font-size="14" font-family="Arial,sans-serif">Conflict boundary</text></svg>