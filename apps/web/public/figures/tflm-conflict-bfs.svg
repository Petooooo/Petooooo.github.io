<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="a b"><title id="a">Output-to-input BFS ordering</title><desc id="b">Conflict graph showing output E placed first, followed by connected buffers in reverse breadth-first order.</desc><rect width="980" height="390" rx="12" fill="#111b25"/><style>text{font-family:Arial,sans-serif;fill:#e6f3ff}.node{fill:#214354;stroke:#78c9e2;stroke-width:2}.ln{fill:none;stroke:#83afc4;stroke-width:2.5;marker-end:url(#arr)}.t{font-size:24px;font-weight:700}.h{font-size:17px}.l{font-size:21px;text-anchor:middle;font-weight:700}</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#83afc4" stroke-width="2"/></marker></defs><text class="t" x="36" y="45">Conflict-aware allocation order</text><text x="36" y="75" font-size="15" fill="#b6c8d5">From the capstone report · prioritize terminal outputs in reverse BFS</text><text class="h" x="58" y="130">Non-conflict buffers</text><rect x="52" y="152" width="300" height="52" rx="8" fill="#275a70"/><text x="202" y="185" text-anchor="middle">Sort by size (largest first)</text><text class="h" x="500" y="130">Conflict-connected buffers</text><path class="ln" d="M737 180L634 248"/><path class="ln" d="M740 180L851 248"/><path class="ln" d="M616 268L526 326"/><path class="ln" d="M616 268L694 326"/><rect class="node" x="707" y="148" width="64" height="52" rx="7"/><text class="l" x="739" y="180">E</text><rect class="node" x="593" y="237" width="64" height="52" rx="7"/><text class="l" x="625" y="270">C</text><rect class="node" x="812" y="237" width="64" height="52" rx="7"/><text class="l" x="844" y="270">D</text><rect class="node" x="490" y="317" width="64" height="52" rx="7"/><text class="l" x="522" y="351">B</text><rect class="node" x="668" y="317" width="64" height="52" rx="7"/><text class="l" x="700" y="351">A</text><text x="60" y="285" font-size="16">→ Output before input</text><text x="60" y="314" font-size="16">→ Favor lower input offsets</text><text x="60" y="343" font-size="16">→ Check overlap constraints</text></svg>