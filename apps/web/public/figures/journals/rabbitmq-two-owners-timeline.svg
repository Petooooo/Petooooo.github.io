<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 960" role="img" aria-labelledby="t d"><title id="t">A delivery can return while the original worker is running</title><desc id="d">Conceptual Gantt-style three-lane timeline. The broker delivery is unacknowledged, the connection fails, and RabbitMQ requeues and redelivers. Worker A keeps running after losing the AMQP connection, while Worker B can begin the same logical job. The overlap is marked. No measured timestamps, internal system addresses or queue names.</desc>
<rect x="0" y="0" width="1540" height="960" rx="0" fill="#081420" stroke="#081420" stroke-width="1.4"/>
<text x="56" y="69" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="36" font-weight="760" fill="#f1faff" text-anchor="start">One job. Two workers. One lost connection.</text>
<text x="56" y="110" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#a8c7d8" text-anchor="start">The broker stopped owning a delivery before the first conversion stopped executing.</text>
<path d="M56 135H1480" fill="none" stroke="#416b80" stroke-width="1.6" stroke-linecap="round" />
<text x="61" y="182" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="730" fill="#8eb8ca" text-anchor="start">RELATIVE EVENT ORDER — NOT MEASURED TIME</text>
<path d="M364 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="364" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Delivered</text>
<path d="M555 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="555" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Connection lost</text>
<path d="M746 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="746" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Requeued</text>
<path d="M936 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="936" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Second delivery</text>
<path d="M1128 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="1128" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Still processing</text>
<path d="M1334 213V722" fill="none" stroke="#385566" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 10"/>
<text x="1334" y="211" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="590" fill="#9cbdd0" text-anchor="middle">Outcome unknown</text>
<rect x="57" y="263" width="1418" height="131" rx="10" fill="#183345" stroke="#36556b" stroke-width="1.4"/>
<text x="81" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="745" fill="#f0f8fe" text-anchor="start">RABBITMQ</text>
<text x="81" y="343" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#b5cad9" text-anchor="start">Delivery ownership</text>
<path d="M337 276V381" fill="none" stroke="#365a70" stroke-width="1.6" stroke-linecap="round" />
<rect x="57" y="428" width="1418" height="131" rx="10" fill="#1b393d" stroke="#36556b" stroke-width="1.4"/>
<text x="81" y="474" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="745" fill="#f0f8fe" text-anchor="start">WORKER A</text>
<text x="81" y="508" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#b5cad9" text-anchor="start">Original conversion</text>
<path d="M337 441V546" fill="none" stroke="#365a70" stroke-width="1.6" stroke-linecap="round" />
<rect x="57" y="593" width="1418" height="131" rx="10" fill="#3b303d" stroke="#36556b" stroke-width="1.4"/>
<text x="81" y="639" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="745" fill="#f0f8fe" text-anchor="start">WORKER B</text>
<text x="81" y="673" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#b5cad9" text-anchor="start">Second consumer</text>
<path d="M337 606V711" fill="none" stroke="#365a70" stroke-width="1.6" stroke-linecap="round" />
<rect x="357" y="309" width="378" height="49" rx="10" fill="#295875" stroke="#76b5d2" stroke-width="1.4"/>
<text x="375" y="340" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="670" fill="#dbf2fd" text-anchor="start">Unacknowledged delivery</text>
<rect x="752" y="309" width="178" height="49" rx="10" fill="#52433e" stroke="#c8a28b" stroke-width="1.4"/>
<text x="771" y="340" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffe0c7" text-anchor="start">Ready again</text>
<rect x="943" y="309" width="386" height="49" rx="10" fill="#294b65" stroke="#86c3d9" stroke-width="1.4"/>
<text x="967" y="340" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="660" fill="#e0f3fc" text-anchor="start">Delivery can be reassigned</text>
<rect x="358" y="476" width="980" height="50" rx="10" fill="#20574d" stroke="#82dbbd" stroke-width="1.4"/>
<text x="382" y="508" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#d9ffee" text-anchor="start">Original conversion continues even without the AMQP connection</text>
<rect x="939" y="641" width="396" height="50" rx="10" fill="#62414f" stroke="#e7afbd" stroke-width="1.4"/>
<text x="960" y="674" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="690" fill="#fff0f3" text-anchor="start">Same logical job starts again</text>
<rect x="934" y="724" width="414" height="91" rx="13" fill="#553a48" stroke="#d99aae" stroke-width="1.4"/>
<text x="956" y="761" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="760" fill="#ffd7df" text-anchor="start">OVERLAPPING PROCESSING WINDOW</text>
<text x="956" y="792" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="530" fill="#ffe7ed" text-anchor="start">Two attempts may compete for one result</text>
<path d="M1135 691V723" fill="none" stroke="#e2b5c7" stroke-width="2.6" stroke-linecap="round" />
<rect x="55" y="833" width="1420" height="79" rx="12" fill="#152d3f" stroke="#496d80" stroke-width="1.4"/>
<text x="79" y="869" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="760" fill="#8fc0d7" text-anchor="start">BROKER CERTAINTY</text>
<text x="305" y="869" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="640" fill="#d7e7f2" text-anchor="start">A delivery was requeued</text>
<text x="790" y="869" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="760" fill="#efb3c7" text-anchor="start">APPLICATION QUESTION</text>
<text x="1080" y="869" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="640" fill="#f7e7ee" text-anchor="start">Which attempt can commit?</text>
<text x="57" y="946" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#89a8ba" text-anchor="start">The diagram depicts failure ordering, not queue depth, elapsed time or an exactly-once execution guarantee.</text>
</svg>
