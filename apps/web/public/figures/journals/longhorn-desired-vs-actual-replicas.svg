<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="t d"><title id="t">Volume status changed without a verified second healthy replica</title><desc id="d">Two side-by-side evidence panels show Longhorn before and after lowering desired replicas from two to one. Before: Degraded, one Healthy replica and one Unknown. After: Healthy label, one known Healthy replica and an old suspect object still listed; a restored second healthy copy was not verified. No physical placement information.</desc>
