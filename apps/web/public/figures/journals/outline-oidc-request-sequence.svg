<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 950" role="img" aria-labelledby="t d"><title id="t">An OAuth login has different request initiators</title><desc id="d">Conceptual OAuth sequence showing browser redirects, Outline backend and GitLab provider. Server-initiated userinfo call timed out; later callback mismatch is a separate incident. The sequence is illustrative, not a trace of all successful requests.</desc>
<rect x="0" y="0" width="1480" height="950" rx="0" fill="#081420" stroke="#081420"/>
<text x="48" y="64" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="36" font-weight="750" fill="#f2faff" text-anchor="start">One login. Two different callers.</text>
<text x="48" y="103" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#a3c2d2" text-anchor="start">A browser reaching GitLab says nothing about Outline's server-side userinfo request.</text>
<path d="M48 127H1432" fill="none" stroke="#2e5267" stroke-width="1" />
<rect x="60" y="168" width="380" height="92" rx="12" fill="#193446" stroke="#537b91"/>
<text x="250" y="207" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="730" fill="#edfaff" text-anchor="middle">BROWSER</text>
<text x="250" y="238" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510" fill="#b2cbd9" text-anchor="middle">redirects</text>
<path d="M250 263V744" fill="none" stroke="#365c70" stroke-width="1.8" stroke-dasharray="6 7"/>
<rect x="555" y="168" width="380" height="92" rx="12" fill="#193446" stroke="#537b91"/>
<text x="745" y="207" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="730" fill="#edfaff" text-anchor="middle">OUTLINE BACKEND</text>
<text x="745" y="238" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510" fill="#b2cbd9" text-anchor="middle">token / userinfo</text>
<path d="M745 263V744" fill="none" stroke="#365c70" stroke-width="1.8" stroke-dasharray="6 7"/>
<rect x="1050" y="168" width="380" height="92" rx="12" fill="#193446" stroke="#537b91"/>
<text x="1240" y="207" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="730" fill="#edfaff" text-anchor="middle">GITLAB</text>
<text x="1240" y="238" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510" fill="#b2cbd9" text-anchor="middle">identity provider</text>
<path d="M1240 263V744" fill="none" stroke="#365c70" stroke-width="1.8" stroke-dasharray="6 7"/>
<path d="M250 328H733" fill="none" stroke="#71bfd0" stroke-width="2.8" />
<path d="M722 321L733 328L722 335" fill="none" stroke="#71bfd0" stroke-width="2.3" />
<text x="497.5" y="314" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#71bfd0" text-anchor="middle">Open wiki / start sign-in</text>
<path d="M745 417H262" fill="none" stroke="#71bfd0" stroke-width="2.8" />
<path d="M273 410L262 417L273 424" fill="none" stroke="#71bfd0" stroke-width="2.3" />
<text x="497.5" y="403" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#71bfd0" text-anchor="middle">Redirect to authorize</text>
