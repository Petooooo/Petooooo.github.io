<path d="M1217 493L1228 500L1217 507" fill="none" stroke="#71bfd0" stroke-width="2.3" />
<text x="745" y="486" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#71bfd0" text-anchor="middle">GitLab authorization page</text>
