<text x="745" y="571" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#98b5d2" text-anchor="middle">Return via browser redirect</text>
<path d="M250 660H733" fill="none" stroke="#98b5d2" stroke-width="2.8" />
<path d="M722 653L733 660L722 667" fill="none" stroke="#98b5d2" stroke-width="2.3" />
<text x="497.5" y="646" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#98b5d2" text-anchor="middle">/auth/oidc.callback</text>
<rect x="552" y="712" width="879" height="103" rx="13" fill="#3a2b39" stroke="#c28594"/>
<text x="574" y="748" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="740" fill="#efb6c2" text-anchor="start">OBSERVED · FEB 23</text>
<text x="574" y="781" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="650" fill="#f7e6ec" text-anchor="start">Outline → GitLab /oauth/userinfo</text>
<text x="574" y="803" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#efb6c2" text-anchor="start">ValidateSSOAccessTask · connect ETIMEDOUT</text>
<path d="M1178 768H1430" fill="none" stroke="#c87885" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="48" y="850" width="1383" height="67" rx="12" fill="#1e3441" stroke="#4d778c"/>
<text x="74" y="878" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="750" fill="#96cade" text-anchor="start">SEPARATE · JUNE</text>
<text x="74" y="903" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="560" fill="#dceaf3" text-anchor="start">Changed public callback address → invalid redirect URI</text>
<text x="48" y="940" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="13" font-weight="500" fill="#85a9ba" text-anchor="start">Conceptual request sequence. Earlier redirects are not individually verified for every failed login.</text>
</svg>
