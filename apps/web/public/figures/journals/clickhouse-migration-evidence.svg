<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Replica health: what each signal can and cannot prove</title><desc id="chart-desc">A verification matrix for migration, not a fabricated chart of cluster health</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#74bfce" stroke-width="1.8"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#324d60"/></pattern></defs><rect width="1500" height="860" rx="20" fill="#081522"/><text x="45" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="31" font-weight="750" fill="#f1f9fe">Replica health: what each signal can and cannot prove</text><text x="45" y="98" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#a6c3d5">A verification matrix for migration, not a fabricated chart of cluster health</text><path d="M45 119H1455" fill="none" stroke="#385367" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="157" width="1398" height="624" rx="16" fill="#102638" stroke="#365369" stroke-width="1.5"/><text x="74" y="197" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#d1e9f4">SAMPLED EVIDENCE vs STRONGER VERIFICATION</text><text x="74" y="226" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc9d7">A clean status field is useful; it is not an end-to-end consistency guarantee.</text><rect x="73" y="269" width="1346" height="54" rx="6" fill="#203a4d" stroke="#203a4d" stroke-width="0"/><text x="91" y="304" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" fill="#eaf6fc">Evidence layer</text><text x="549" y="304" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" fill="#eaf6fc">Observed intermediate state</text><text x="913" y="304" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" fill="#eaf6fc">Additional verification required</text><rect x="73" y="328" width="1346" height="67" rx="0" fill="#152d3e" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="343" width="7" height="37" rx="3" fill="#7ed7ba" stroke="#7ed7ba" stroke-width="0"/><text x="105" y="369" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Table definitions</text><circle cx="524" cy="362" r="10" fill="#245c50" stroke="#7ed7ba" stroke-width="2"/><text x="549" y="368" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#baddd8">Replicated engines visible</text><path d="M887 338V384" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="368" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">Schema/engine parity on all replicas</text><rect x="73" y="397" width="1346" height="67" rx="0" fill="#183141" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="412" width="7" height="37" rx="3" fill="#7ed7ba" stroke="#7ed7ba" stroke-width="0"/><text x="105" y="438" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Keeper session</text><circle cx="524" cy="431" r="10" fill="#245c50" stroke="#7ed7ba" stroke-width="2"/><text x="549" y="437" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#baddd8">Read-only flag cleared</text><path d="M887 407V453" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="437" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">Identity + session behavior under restart</text><rect x="73" y="466" width="1346" height="67" rx="0" fill="#152d3e" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="481" width="7" height="37" rx="3" fill="#7ed7ba" stroke="#7ed7ba" stroke-width="0"/><text x="105" y="507" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Replication work</text><circle cx="524" cy="500" r="10" fill="#245c50" stroke="#7ed7ba" stroke-width="2"/><text x="549" y="506" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#baddd8">Queue drained at one sample</text><path d="M887 476V522" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="506" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">No stuck work or persistent lag</text><rect x="73" y="535" width="1346" height="67" rx="0" fill="#183141" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="550" width="7" height="37" rx="3" fill="#7ed7ba" stroke="#7ed7ba" stroke-width="0"/><text x="105" y="576" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Local data parts</text><circle cx="524" cy="569" r="10" fill="#245c50" stroke="#7ed7ba" stroke-width="2"/><text x="549" y="575" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#baddd8">Second replica was catching up</text><path d="M887 545V591" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="575" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">Relevant partitions and logical content</text><rect x="73" y="604" width="1346" height="67" rx="0" fill="#152d3e" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="619" width="7" height="37" rx="3" fill="#7ed7ba" stroke="#7ed7ba" stroke-width="0"/><text x="105" y="645" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Views / derived data</text><circle cx="524" cy="638" r="10" fill="#245c50" stroke="#7ed7ba" stroke-width="2"/><text x="549" y="644" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#baddd8">Recreation handled separately</text><path d="M887 614V660" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="644" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">No duplicate insert transformations</text><rect x="73" y="673" width="1346" height="67" rx="0" fill="#183141" stroke="#2a485d" stroke-width="0.8"/><rect x="83" y="688" width="7" height="37" rx="3" fill="#edbd7e" stroke="#edbd7e" stroke-width="0"/><text x="105" y="714" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5f3fa">Application results</text><circle cx="524" cy="707" r="10" fill="#6c5640" stroke="#edbd7e" stroke-width="2"/><text x="549" y="713" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#f0cca8">Not fully established publicly</text><path d="M887 683V729" fill="none" stroke="#315268" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="913" y="713" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#bfcfdd">Representative read/write and recovery</text><rect x="81" y="752" width="1231" height="1" rx="0" fill="#315268" stroke="#315268" stroke-width="0"/><text x="88" y="766" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" fill="#a8bdcb">Markers denote evidence scope, not real-time health measurements or benchmark success.</text><path d="M45 798H1455" fill="none" stroke="#385367" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="830" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#acc2cf">Illustrative checks: replica state, data equivalence and application correctness must be evaluated separately.</text></svg>