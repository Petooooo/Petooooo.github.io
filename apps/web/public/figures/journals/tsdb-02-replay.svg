<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595" role="img" aria-label="Restart replay and time boundary"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="593" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Restart replay and time boundary</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Toy record model; not Prometheus binary WAL or repair behavior</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Already compacted</text><text x="580" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Retained record stream</text><rect x="40" y="155" width="500" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="290.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Block: t = 0, 1</text><text x="290.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Values 10, 11</text><rect x="580" y="155" width="500" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="830.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Series definition + samples</text><text x="830.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">t = 1, 2, 3 + incomplete tail</text><path d="M290 233V270H560V300" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M830 233V270H560" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="300" width="600" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="560.0" y="329" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Replay with cutoff t = 2</text><text x="560.0" y="354" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Skip t = 1; report incomplete tail</text><path d="M560 378V420" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="420" width="1040" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="560.0" y="449" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Recovered view: 10, 11, 12, 13</text><text x="560.0" y="474" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Block data + reconstructed recent samples</text><text x="40" y="545" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Without the log, this model retains only 10 and 11.</text><text x="40" y="578" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Teaching model · not historical measurements</text></svg>
