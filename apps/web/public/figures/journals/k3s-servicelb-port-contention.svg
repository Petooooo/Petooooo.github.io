<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 870" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">A new Service, one contested host port</title><desc id="fig-desc">Observed access state and controller-generated claim, not a synthetic four-step deployment pipeline</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#7cc5d2" stroke-width="1.7"/></marker><pattern id="hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="13" height="13" fill="#473646"/><path d="M0 0H13" stroke="#ad7894" stroke-width="3"/></pattern></defs><rect width="1500" height="870" rx="18" fill="#091522"/><text x="45" y="58" font-size="32" font-weight="740" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#f2faff">A new Service, one contested host port</text><text x="45" y="98" font-size="18" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#acc9d9">Observed access state and controller-generated claim, not a synthetic four-step deployment pipeline</text><path d="M44 121H1456" fill="none" stroke="#3a5368" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="177" font-size="20" font-weight="630" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#d8edf6">The same abstract port P is a scarce host-level resource</text><rect x="43" y="201" width="1414" height="522" rx="17" fill="#101f2f" stroke="#31495b" stroke-width="1.4" opacity="1"/><text x="72" y="245" font-size="18" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#d5e8f1">OBSERVED SEQUENCE</text><rect x="294" y="267" width="375" height="61" rx="8" fill="#1d3448" stroke="#365870" stroke-width="1.4" opacity="1"/><text x="311" y="292" font-size="17" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#77d7ba">BEFORE</text><text x="311" y="316" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#c4d4e4">Existing endpoint works</text><rect x="669" y="267" width="375" height="61" rx="8" fill="#1d3448" stroke="#365870" stroke-width="1.4" opacity="1"/><text x="686" y="292" font-size="17" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#f2bf8b">NEW LOADBALANCER</text><text x="686" y="316" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#c4d4e4">ServiceLB is triggered</text><rect x="1044" y="267" width="375" height="61" rx="8" fill="#1d3448" stroke="#365870" stroke-width="1.4" opacity="1"/><text x="1061" y="292" font-size="17" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#77d7ba">SERVICE REMOVED</text><text x="1061" y="316" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#c4d4e4">Existing endpoint recovers</text><path d="M669 257V672" fill="none" stroke="#587185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><path d="M1044 257V672" fill="none" stroke="#587185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><text x="73" y="393" font-size="18" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#e6f3fa">Existing hostPort</text><text x="73" y="421" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#b5ccd9">access path</text><text x="73" y="509" font-size="18" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#e6f3fa">ServiceLB</text><text x="73" y="536" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#b5ccd9">host-port claim</text><text x="73" y="625" font-size="18" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#e6f3fa">Host port P</text><text x="73" y="652" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#b5ccd9">ownership</text><rect x="294" y="359" width="1125" height="91" rx="7" fill="#142739" stroke="#2a4558" stroke-width="1" opacity="1"/><rect x="294" y="472" width="1125" height="91" rx="7" fill="#142739" stroke="#2a4558" stroke-width="1" opacity="1"/><rect x="294" y="581" width="1125" height="91" rx="7" fill="#142739" stroke="#2a4558" stroke-width="1" opacity="1"/><rect x="310" y="375" width="343" height="61" rx="6" fill="#1a594b" stroke="#65b99a" stroke-width="1.4" opacity="1"/><text x="480" y="412" font-size="19" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#dffff1">REACHABLE</text><rect x="686" y="375" width="340" height="61" rx="6" fill="#5c3c43" stroke="#c18091" stroke-width="1.4" opacity="1"/><text x="856" y="409" font-size="19" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ffdde3">UNREACHABLE</text><rect x="1061" y="375" width="339" height="61" rx="6" fill="#1a594b" stroke="#65b99a" stroke-width="1.4" opacity="1"/><text x="1231" y="412" font-size="19" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#dffff1">REACHABLE AGAIN</text><text x="480" y="528" font-size="16" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a7c7d6">No new LB workload</text><rect x="697" y="483" width="318" height="68" rx="7" fill="#55433a" stroke="#e0ad74" stroke-width="1.4" opacity="1"/><text x="856" y="509" font-size="18" font-weight="700" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ffe4bc">svclb-* created</text><text x="856" y="536" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ebcda3">requests same hostPort</text><text x="1231" y="514" font-size="16" font-weight="550" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#b6ddd1">Generated resources</text><text x="1231" y="538" font-size="16" font-weight="550" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#b6ddd1">removed</text><rect x="325" y="598" width="277" height="55" rx="7" fill="#214f4d" stroke="#6bc0ad" stroke-width="1.4" opacity="1"/><text x="463" y="633" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ddfbf3">Existing allocation</text><rect x="713" y="595" width="277" height="60" rx="7" fill="url(#hatch)" stroke="#db9aa4" stroke-width="1.4" opacity="1"/><text x="852" y="618" font-size="18" font-weight="750" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ffebed">CONTESTED</text><text x="852" y="642" font-size="14" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#f6c5cb">not two successful binds</text><rect x="1091" y="598" width="277" height="55" rx="7" fill="#214f4d" stroke="#6bc0ad" stroke-width="1.4" opacity="1"/><text x="1229" y="633" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#ddfbf3">Existing path restored</text><rect x="66" y="745" width="1369" height="44" rx="8" fill="#202f3c" stroke="#486172" stroke-width="1.4" opacity="1"/><circle cx="89" cy="767" r="7" fill="#f2be8e" stroke="#f2be8e" stroke-width="1"/><text x="109" y="773" font-size="16" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#cfdfec">Additional observation: changing the new Service port avoided the overlap; no kernel bind trace was retained.</text><path d="M44 810H1456" fill="none" stroke="#3a5368" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="46" y="841" font-size="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#b6cbd9">Schematic event order only. Port P is abstract, and no exact host, port, timeline or actual socket ownership trace is disclosed.</text></svg>