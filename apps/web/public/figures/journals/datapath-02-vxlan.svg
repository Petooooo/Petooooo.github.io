<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="617" viewBox="0 0 1120 617" role="img" aria-label="VXLAN: inner and outer addresses"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="615" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">VXLAN: inner and outer addresses</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Plain IPv4 underlay example; no optional headers</text><rect x="40" y="115" width="490" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="285.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source node VTEP</text><text x="285.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">192.0.2.101</text><rect x="590" y="115" width="490" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="835.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Destination node VTEP</text><text x="835.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">192.0.2.102</text><path d="M530 152H590" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="235" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Encapsulated packet on the underlay</text><rect x="40" y="258" width="175" height="80" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="127.5" y="287" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Outer IP</text><text x="127.5" y="312" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">20 B</text><rect x="215" y="258" width="115" height="80" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="272.5" y="287" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">UDP</text><text x="272.5" y="312" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">8 B</text><rect x="330" y="258" width="125" height="80" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="392.5" y="287" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">VXLAN</text><text x="392.5" y="312" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">8 B</text><rect x="455" y="258" width="200" height="80" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="555.0" y="287" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Inner Ethernet</text><text x="555.0" y="312" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">14 B</text><rect x="655" y="258" width="425" height="80" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="867.5" y="287" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Inner IP + data</text><text x="867.5" y="312" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">≤ 1450 B</text><text x="40" y="380" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#253c51">Outer: 192.0.2.101 → 192.0.2.102</text><text x="40" y="414" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#253c51">Inner: 192.0.2.10 → 203.0.113.20</text><rect x="40" y="452" width="1040" height="75" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="481" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">1500 − (20 + 8 + 8 + 14) = 1450 bytes</text><text x="560.0" y="506" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Header boxes are schematic, not to scale</text><text x="40" y="568" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Route → neighbor → FDB → remote underlay endpoint</text><text x="40" y="600" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not an incident packet capture</text></svg>
