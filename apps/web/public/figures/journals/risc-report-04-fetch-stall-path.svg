<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-label="Why PC hold alone was not enough"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L9 4L1 7z" fill="#0c6184"/></marker></defs><rect x="0" y="0" width="1280" height="750" rx="18" fill="#fff" stroke="#bed0da" stroke-width="2"/><rect x="0" y="0" width="1280" height="113" rx="18" fill="#f5f9fc" stroke="#f5f9fc" stroke-width="1"/><rect x="36" y="35" width="6" height="47" rx="2" fill="#0e6384" stroke="#0e6384" stroke-width="1"/><text x="58" y="61" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="32" font-weight="760">Why PC hold alone was not enough</text><text x="59" y="93" text-anchor="start" fill="#587184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="510">Report pages 2–3 · conditional PC, INST_M buffer and ID capture</text><path d="M40 124H1240" stroke="#cfdae3" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="52" y="193" width="1152" height="434" rx="12" fill="#f8fbfd" stroke="#c4d0d9" stroke-width="1.5"/><text x="70" y="224" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="750">Instruction Fetch has separate address and instruction state</text><rect x="87" y="300" width="213" height="105" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="193.5" y="335" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">PC state</text><text x="193.5" y="361" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">start / RSTN</text><rect x="390" y="273" width="226" height="100" rx="9" fill="#f4f9fc" stroke="#c17b36" stroke-width="2"/><text x="503.0" y="308" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">Hold or PC+4</text><text x="503.0" y="334" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">stall_MEM / stall_ID</text><rect x="390" y="425" width="226" height="98" rx="9" fill="#f4f9fc" stroke="#27759a" stroke-width="2"/><text x="503.0" y="460" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">Branch target</text><text x="503.0" y="486" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">BRANCH = 1</text><rect x="718" y="319" width="211" height="113" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="823.5" y="354" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">INSTR → INST_M</text><text x="823.5" y="380" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">fetch buffer</text><rect x="1012" y="319" width="171" height="113" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="1097.5" y="354" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">ID INST</text><text x="1097.5" y="380" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">posedge CLK</text><path d="M300 351L380 324" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M300 361L380 469" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M616 329L708 362" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M616 479L706 391" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M929 373L999 373" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="582" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="560">A held PC does not automatically mean INST_M and INST are held on the same edge</text><path d="M40 694H1240" stroke="#c4d4df" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="47" y="726" text-anchor="start" fill="#6d8593" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="480">Vector redraw of the source report · not a hardware trace</text></svg>
