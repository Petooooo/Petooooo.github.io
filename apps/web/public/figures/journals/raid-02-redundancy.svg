<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="602" viewBox="0 0 1120 602" role="img" aria-label="Mirroring and known-erasure recovery"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="600" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Mirroring and known-erasure recovery</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">4096-byte deterministic XOR model; not a real MD array</text><text x="40" y="135" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Two-way mirror</text><rect x="40" y="155" width="500" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="290.0" y="200.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Disk A: data X</text><rect x="580" y="155" width="500" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="830.0" y="200.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Disk B: copy of X</text><text x="40" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Three-member single-parity stripe</text><rect x="40" y="298" width="330" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="205.0" y="342.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">A</text><rect x="395" y="298" width="330" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="560.0" y="342.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">B</text><rect x="750" y="298" width="330" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="915.0" y="342.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">P = A XOR B</text><rect x="40" y="423" width="500" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="290.0" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">A missing: P XOR B</text><text x="290.0" y="477" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Reconstruct A</text><rect x="580" y="423" width="500" height="76" rx="7" fill="#f6dfda" stroke="#a9bbc9"/><text x="830.0" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Two blocks missing</text><text x="830.0" y="477" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Insufficient information</text><text x="40" y="550" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">A parity mismatch alone cannot identify the incorrect member.</text><text x="40" y="585" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">All 3 single erasures restored; two erasures rejected; altered block detected</text></svg>
