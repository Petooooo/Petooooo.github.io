<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Storage interfaces and protection"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="618" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Storage interfaces and protection</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Access semantics are separate from replication</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Consumer-facing interface</text><text x="650" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Examples of backing storage</text><rect x="40" y="155" width="540" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="310.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Block</text><text x="310.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Logical block addresses</text><path d="M580 194H630" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="155" width="450" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="855.0" y="201.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Local device / replicated device</text><rect x="40" y="260" width="540" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="310.0" y="289" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">File</text><text x="310.0" y="314" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Paths and file operations</text><path d="M580 299H630" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="260" width="450" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="855.0" y="306.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Filesystem / network file service</text><rect x="40" y="365" width="540" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="310.0" y="394" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Object</text><text x="310.0" y="419" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Bucket and key API</text><path d="M580 404H630" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="365" width="450" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="855.0" y="411.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Object server and its storage</text><rect x="40" y="495" width="1040" height="74" rx="7" fill="#f4e8ce" stroke="#c4aa77"/><text x="60" y="525" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Interface does not determine durability or failure independence.</text><text x="60" y="550" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Kubernetes volumeMode: Filesystem or Block</text><text x="40" y="603" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Teaching model · not historical topology or measurements</text></svg>
