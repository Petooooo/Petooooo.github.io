<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="599" viewBox="0 0 1120 599" role="img" aria-label="JBD2 commit, replay and checkpoint"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="597" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">JBD2 commit, replay and checkpoint</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual full transaction; fast commits and checksums omitted</text><text x="40" y="131" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Journal transaction (full commit)</text><rect x="40" y="157" width="245" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="162.5" y="199.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Descriptor</text><path d="M285 192H305" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="305" y="157" width="245" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="427.5" y="199.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Logged blocks</text><path d="M550 192H570" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="157" width="245" height="70" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="692.5" y="199.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Optional revoke</text><path d="M815 192H835" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="835" y="157" width="245" height="70" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="957.5" y="199.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Commit record</text><rect x="40" y="292" width="490" height="78" rx="7" fill="#f6dfda" stroke="#a9bbc9"/><text x="285.0" y="321" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Crash before valid commit</text><text x="285.0" y="346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Do not replay as committed</text><rect x="590" y="292" width="490" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="835.0" y="321" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Valid commit, not checkpointed</text><text x="835.0" y="346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Replay eligible on recovery</text><path d="M295 227V260H285V292" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><path d="M957 227V260H835V292" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="590" y="425" width="490" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="835.0" y="454" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Checkpoint to home locations</text><text x="835.0" y="479" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Normal post-commit path</text><path d="M1080 192H1095V462H1080" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="550" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Commit marks a recoverable transaction; checkpoint permits safe journal reuse.</text><text x="40" y="582" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a historical I/O trace</text></svg>
