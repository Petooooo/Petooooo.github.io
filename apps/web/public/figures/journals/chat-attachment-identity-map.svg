<rect x="58" y="719" width="1364" height="72" rx="12" fill="#102738" stroke="#35576b" stroke-width="1.5"/>
<text x="81" y="749" fill="#8bc8d9" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">OBSERVED</text>
<text x="235" y="750" fill="#8ae6bf" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="680" text-anchor="start">new uploads succeeded</text>
<text x="730" y="750" fill="#e8bd93" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="680" text-anchor="start">historical attachment access failed</text>
<text x="81" y="776" fill="#97b1c0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Conceptual identities only; no real IDs, object counts, endpoints or deployment topology.</text>
