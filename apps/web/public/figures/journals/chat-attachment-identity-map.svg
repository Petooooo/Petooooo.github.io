<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 840" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">One attachment, multiple identities</title><desc id="fig-desc">A Rocket.Chat message and retrieval route refer to an upload record. The record must identify the same file in old GridFS chunks and new MinIO object keys. This is a conceptual relation map, not a real topology.</desc>
<rect x="0" y="0" width="1480" height="840" rx="0" fill="#081420" stroke="#081420" stroke-width="0"/>
<text x="52" y="67" fill="#f0f8fe" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="37" font-weight="750" text-anchor="start">One attachment, multiple identities</text>
<text x="52" y="103" fill="#abc9d8" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">A retained message does not mean the binary is available from the new backend.</text>
<path d="M52 125H1428" fill="none" stroke="#315064" stroke-width="1"  stroke-linecap="round"/>
<text x="62" y="177" fill="#8cb9cb" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">APPLICATION REFERENCE</text>
<rect x="58" y="194" width="330" height="135" rx="17" fill="#122b3b" stroke="#46697f" stroke-width="1.5"/>
<text x="83" y="238" fill="#eef8ff" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Message &amp; attachment</text>
<text x="83" y="274" fill="#abc9da" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">historical message present</text>
<rect x="58" y="408" width="330" height="132" rx="17" fill="#122b3b" stroke="#46697f" stroke-width="1.5"/>
<text x="83" y="450" fill="#eef8ff" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">File retrieval route</text>
<text x="83" y="485" fill="#abc9da" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">browser URL / authorization</text>
<text x="504" y="177" fill="#8cb9cb" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">METADATA IDENTITY</text>
<rect x="476" y="194" width="493" height="347" rx="18" fill="#153548" stroke="#6c94ac" stroke-width="2.1"/>
<rect x="498" y="214" width="449" height="54" rx="9" fill="#20465b" stroke="#395f75" stroke-width="1.5"/>
<text x="521" y="249" fill="#d3f6ef" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">UPLOAD RECORD</text>
<text x="509" y="318" fill="#f1f9ff" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="680" text-anchor="start">_id / name</text>
<path d="M506 337H940" fill="none" stroke="#496a7d" stroke-width="1.2"  stroke-linecap="round"/>
<text x="509" y="377" fill="#f4f9fb" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="610" text-anchor="start">AmazonS3.path / path / url</text>
<path d="M506 398H940" fill="none" stroke="#496a7d" stroke-width="1.2"  stroke-linecap="round"/>
<text x="509" y="443" fill="#b1cfde" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">record points to a binary location</text>
<text x="509" y="489" fill="#80ddc3" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="660" text-anchor="start">One ID, multiple lookup contracts</text>
<text x="1056" y="177" fill="#8cb9cb" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">PAYLOAD IDENTITY</text>
