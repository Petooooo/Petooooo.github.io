<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="551" viewBox="0 0 1120 551" role="img" aria-label="From OCI content to a writable root filesystem"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="549" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">From OCI content to a writable root filesystem</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Logical content references above; applied filesystem states below</text><rect x="40" y="115" width="1040" height="170" rx="7" fill="#f2f6fa" stroke="#c5d6e2"/><text x="60" y="147" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Content store</text><rect x="60" y="170" width="265" height="83" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="192.5" y="199" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Manifest</text><text x="192.5" y="224" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Ordered descriptors</text><rect x="410" y="170" width="290" height="83" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="555.0" y="199" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Image config</text><text x="555.0" y="224" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Ordered DiffIDs</text><rect x="780" y="170" width="280" height="83" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="920.0" y="199" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Layer blobs</text><text x="920.0" y="224" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Content digests</text><path d="M325 210H410" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M193 170V159H920V170" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="328" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Unpack: apply layer contents in order</text><path d="M920 285V343H190V370" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="370" width="300" height="82" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="190.0" y="399" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Committed base</text><text x="190.0" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Apply D0, then commit</text><rect x="410" y="370" width="300" height="82" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="560.0" y="399" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Committed top</text><text x="560.0" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Apply D1 on base</text><rect x="780" y="370" width="300" height="82" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="930.0" y="399" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Active snapshot</text><text x="930.0" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Container writable state</text><path d="M340 411H410" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M710 411H780" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="500" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Blob digest, DiffID, ChainID and local directory ID are distinct.</text><text x="40" y="534" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a captured runtime trace</text></svg>
