<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="From aggregate symptom to targeted kernel event"><rect width="1280" height="590" rx="18" fill="#0b1220"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#74d9ed" stroke-width="1.8"/></marker></defs><text x="43" y="58" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f3f9ff" font-weight="740" >From aggregate symptom to targeted kernel event</text><text x="43" y="97" font-family="Inter,Arial,sans-serif" font-size="17" fill="#b0c1cf" font-weight="500" >Metrics locate an interval; probes can help explain what happened inside it</text><path d="M43 123H1237" stroke="#395168"/><rect x="43" y="192" width="213.2" height="276" rx="15" fill="#1b3043" stroke="#528da8" stroke-width="2"/><text x="59" y="233" font-family="Inter,Arial,sans-serif" font-size="19" fill="#82dae8" font-weight="700" >01</text><text x="59" y="286" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f3f9ff" font-weight="650" >Observe</text><text x="59" y="361" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >/proc + metrics</text><text x="59" y="385" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >CPU / I/O signals</text><path d="M260.2 332H281.2" fill="none" stroke="#7ee0ed" stroke-width="2.4" marker-end="url(#a)"/><rect x="288.2" y="192" width="213.2" height="276" rx="15" fill="#1b3043" stroke="#528da8" stroke-width="2"/><text x="304.2" y="233" font-family="Inter,Arial,sans-serif" font-size="19" fill="#82dae8" font-weight="700" >02</text><text x="304.2" y="286" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f3f9ff" font-weight="650" >Locate</text><text x="304.2" y="361" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Time window</text><text x="304.2" y="385" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Workload identity</text><path d="M505.4 332H526.4" fill="none" stroke="#7ee0ed" stroke-width="2.4" marker-end="url(#a)"/><rect x="533.4" y="192" width="213.2" height="276" rx="15" fill="#1b3043" stroke="#528da8" stroke-width="2"/><text x="549.4" y="233" font-family="Inter,Arial,sans-serif" font-size="19" fill="#82dae8" font-weight="700" >03</text><text x="549.4" y="286" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f3f9ff" font-weight="650" >Probe</text><text x="549.4" y="361" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >eBPF / BCC</text><text x="549.4" y="385" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >kprobe / events</text><path d="M750.5999999999999 332H771.5999999999999" fill="none" stroke="#7ee0ed" stroke-width="2.4" marker-end="url(#a)"/><rect x="778.5999999999999" y="192" width="213.2" height="276" rx="15" fill="#1b3043" stroke="#528da8" stroke-width="2"/><text x="794.5999999999999" y="233" font-family="Inter,Arial,sans-serif" font-size="19" fill="#82dae8" font-weight="700" >04</text><text x="794.5999999999999" y="286" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f3f9ff" font-weight="650" >Correlate</text><text x="794.5999999999999" y="361" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Events + logs</text><text x="794.5999999999999" y="385" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Latency / counts</text><path d="M995.8 332H1016.8" fill="none" stroke="#7ee0ed" stroke-width="2.4" marker-end="url(#a)"/><rect x="1023.8" y="192" width="213.2" height="276" rx="15" fill="#1b3043" stroke="#6fdeb4" stroke-width="2"/><text x="1039.8" y="233" font-family="Inter,Arial,sans-serif" font-size="19" fill="#82dae8" font-weight="700" >05</text><text x="1039.8" y="286" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f3f9ff" font-weight="650" >Verify</text><text x="1039.8" y="361" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Repeat workload</text><text x="1039.8" y="385" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b6cddc" font-weight="500" >Measure overhead</text><text x="43" y="551" font-family="Inter,Arial,sans-serif" font-size="16" fill="#a9bfce" font-weight="500" >A graph shows a change; a trace plus a controlled test supports an explanation.</text><text x="1237" y="551" font-family="Inter,Arial,sans-serif" font-size="13" fill="#728ea3" font-weight="500" text-anchor="end">STUDY DIAGRAM</text></svg>