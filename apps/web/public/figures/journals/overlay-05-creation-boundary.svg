<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="655" viewBox="0 0 1120 655" role="img" aria-label="Container creation failure boundaries"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="653" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Container creation failure boundaries</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Logical stages, not a fixed CRI call sequence</text><rect x="40" y="116" width="450" height="66" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="265.0" y="145" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Resolve image</text><text x="265.0" y="170" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Manifest / identity</text><path d="M265 182V198" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="198" width="450" height="66" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="265.0" y="227" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Fetch / reuse blobs</text><text x="265.0" y="252" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Content availability</text><path d="M265 264V280" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="280" width="450" height="66" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="265.0" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Unpack / reuse chain</text><text x="265.0" y="334" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Committed snapshots</text><path d="M265 346V362" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="362" width="450" height="66" rx="7" fill="#f6dfda" stroke="#a9bbc9"/><text x="265.0" y="391" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Prepare active snapshot</text><text x="265.0" y="416" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Parent stat failure</text><path d="M265 428V444" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="444" width="450" height="66" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="265.0" y="473" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Mount root filesystem</text><text x="265.0" y="498" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Usable mount view</text><path d="M265 510V526" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="526" width="450" height="66" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="265.0" y="555" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Start process</text><text x="265.0" y="580" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Runtime / app startup</text><rect x="540" y="360" width="540" height="105" rx="7" fill="#f6dfda" stroke="#d0a198"/><text x="560" y="391" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#253c51">Observed error boundary</text><text x="560" y="422" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Parent directory lookup failed</text><text x="560" y="447" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">No proof of later application startup</text><path d="M490 395H540" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="540" y="155" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Separate evidence</text><text x="540" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Content present ≠ snapshot usable</text><text x="540" y="231" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Commit output ≠ process running</text><text x="540" y="265" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Process running ≠ volume verified</text><text x="40" y="638" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a captured runtime trace</text></svg>
