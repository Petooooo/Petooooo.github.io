<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="From symptom to kernel evidence"><rect width="1280" height="590" rx="18" fill="#0b1220"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#8cdef2" stroke-width="2"/></marker></defs><text x="43" y="58" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f1f8ff" font-weight="750" >From symptom to kernel evidence</text><text x="43" y="98" font-family="Inter,Arial,sans-serif" font-size="17" fill="#a8bdcb" font-weight="500" >Tracing helps narrow the question; it does not substitute for mechanism analysis</text><path d="M43 123H1237" stroke="#3c5266"/><rect x="43" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="60" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >01</text><text x="60" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >User-visible</text><text x="60" y="321" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >symptom</text><text x="60" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Blocked / slow task</text><text x="60" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Observed latency</text><path d="M258.6 341H279.6" stroke="#81d9ed" stroke-width="2" marker-end="url(#arr)"/><rect x="288.6" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="305.6" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >02</text><text x="305.6" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Time series</text><text x="305.6" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >ftrace events</text><text x="305.6" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >KernelShark timeline</text><path d="M504.20000000000005 341H525.2" stroke="#81d9ed" stroke-width="2" marker-end="url(#arr)"/><rect x="534.2" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="551.2" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >03</text><text x="551.2" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Subsystem</text><text x="551.2" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Scheduler + runqueue</text><text x="551.2" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >VM / page cache</text><path d="M749.8000000000001 341H770.8000000000001" stroke="#81d9ed" stroke-width="2" marker-end="url(#arr)"/><rect x="779.8" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="796.8" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >04</text><text x="796.8" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Call path</text><text x="796.8" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >VFS / block I/O</text><text x="796.8" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >IRQ + workqueue</text><path d="M995.4 341H1016.4000000000001" stroke="#81d9ed" stroke-width="2" marker-end="url(#arr)"/><rect x="1025.4" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#75dbbb" stroke-width="2"/><text x="1042.4" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >05</text><text x="1042.4" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Hypothesis</text><text x="1042.4" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Check evidence</text><text x="1042.4" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Repeat controlled test</text><text x="43" y="554" font-family="Inter,Arial,sans-serif" font-size="16" fill="#abc3d0" font-weight="500" >Distinguish a task that is sleeping from one that is runnable but delayed.</text><text x="1236" y="554" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7b98ac" font-weight="500" text-anchor="end">CONCEPTUAL · OBSERVATIONS ≠ CAUSES</text></svg>