xt x="830.0" y="476.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Replica set and application data</text><rect x="40" y="532" width="1040" height="106" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="562" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Recorded separately</text><text x="60" y="591" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Unregister rejected: stopping, not stopped</text><text x="60" y="618" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5e7387">Later observations: port in use; busy globalmount</text><text x="40" y="671" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual V1 model · not a historical volume inventory</text></svg>
