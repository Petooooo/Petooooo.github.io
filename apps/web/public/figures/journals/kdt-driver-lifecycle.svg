nter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Threaded IRQ / work</text><text x="1042.4" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Userspace interface</text><text x="43" y="554" font-family="Inter,Arial,sans-serif" font-size="16" fill="#abc3d0" font-weight="500" >Blocking work belongs outside hard interrupt context; lifecycle cleanup is just as important as probe.</text><text x="1236" y="554" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7b98ac" font-weight="500" text-anchor="end">CONCEPTUAL · OBSERVATIONS ≠ CAUSES</text></svg>