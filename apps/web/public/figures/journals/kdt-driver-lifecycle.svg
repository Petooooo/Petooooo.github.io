<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="An embedded device crosses several OS boundaries"><rect width="1280" height="590" rx="18" fill="#0b1220"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#8cdef2" stroke-width="2"/></marker></defs><text x="43" y="58" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f1f8ff" font-weight="750" >An embedded device crosses several OS boundaries</text><text x="43" y="98" font-family="Inter,Arial,sans-serif" font-size="17" fill="#a8bdcb" font-weight="500" >Boot, device description and interrupt context change what driver code may do</text><path d="M43 123H1237" stroke="#3c5266"/><rect x="43" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="60" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >01</text><text x="60" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Boot chain</text><text x="60" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Bootloader</text><text x="60" y="396" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Kernel / rootfs</text><path d="M258.6 341H279.6" stroke="#81d9ed" stroke-width="2" marker-end="url(#arr)"/><rect x="288.6" y="201" width="211.6" height="267" rx="16" fill="#1a2f40" stroke="#5e9fba" stroke-width="2"/><text x="305.6" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="#82dce8" font-weight="750" >02</text><text x="305.6" y="296" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f1f8ff" font-weight="650" >Device model</text><text x="305.6" y="373" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b7cbd9" font-weight="500" >Device tree</text><text x="305.6" y="396" font-family="Inter,Arial,sans-serif" font-size="1