<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="635" viewBox="0 0 1120 635" role="img" aria-label="Name removal and mount detachment are different"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="633" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Name removal and mount detachment are different</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Separate the operation from the errno before diagnosing</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Operation</text><text x="265" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Relationship changed</text><text x="705" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Limit or remaining state</text><rect x="40" y="151" width="1040" height="74" rx="7" fill="#e3edf6" stroke="#c0d0dd"/><text x="58" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">unlink</text><text x="265" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" fill="#253c51">Remove a file name</text><text x="705" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#253c51">Open references may survive</text><rect x="40" y="237" width="1040" height="74" rx="7" fill="#f6dfda" stroke="#c0d0dd"/><text x="58" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">rmdir</text><text x="265" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" fill="#253c51">Remove an empty directory</text><text x="705" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#253c51">Mountpoint may return EBUSY</text><rect x="40" y="323" width="1040" height="74" rx="7" fill="#f4e8ce" stroke="#c0d0dd"/><text x="58" y="366" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">umount</text><text x="265" y="366" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" fill="#253c51">Detach mount attachment</text><text x="705" y="366" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#253c51">Active refs / submounts may block</text><rect x="40" y="409" width="1040" height="74" rx="7" fill="#f4e8ce" stroke="#c0d0dd"/><text x="58" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Lazy detach</text><text x="265" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" fill="#253c51">Detach namespace view now</text><text x="705" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#253c51">Reference cleanup deferred</text><rect x="40" y="510" width="1040" height="75" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="541" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#253c51">Observed: rm → Device or resource busy</text><text x="60" y="568" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5e7387">Exact mount holder and subsequent unmount result not established.</text><text x="40" y="618" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Historical rm error + conceptual operation comparison</text></svg>
