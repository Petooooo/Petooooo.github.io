<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="699" viewBox="0 0 1120 699" role="img" aria-label="Migration is a sequence of validation gates"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="697" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Migration is a sequence of validation gates</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Proposed maintenance plan, not a completed historical procedure</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Proposed gate</text><text x="620" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Evidence before proceeding</text><rect x="40" y="151" width="510" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="190.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Inventory and backup</text><path d="M550 183H610" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="151" width="470" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="190.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Role / unique data / quorum</text><path d="M295 216V232" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="232" width="510" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="271.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Quiesce actual writers</text><path d="M550 264H610" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="232" width="470" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="271.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Tasks, shims and mounts checked</text><path d="M295 297V313" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="313" width="510" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="352.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Copy consistent storage</text><path d="M550 345H610" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="313" width="470" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="352.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Metadata + content + attributes</text><path d="M295 378V394" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="394" width="510" height="65" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="295.0" y="433.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Validate data mount</text><path d="M550 426H610" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="394" width="470" height="65" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="845.0" y="433.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Expected device and path</text><path d="M295 459V475" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="475" width="510" height="65" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="295.0" y="514.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Start and verify workload</text><path d="M550 507H610" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="475" width="470" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="514.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Snapshot creation / volume data</text><rect x="40" y="579" width="1040" height="70" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="608" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Failure: stop before accepting new writes; preserve a consistent authoritative copy.</text><text x="60" y="633" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">After new writes, rollback requires reconciliation of newer state.</text><text x="40" y="682" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical node inventory</text></svg>
