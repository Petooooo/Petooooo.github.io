<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="Pod slots and IP addresses are separate budgets"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#738da5"/></marker><pattern id="unused" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#c6d5e1" stroke-width="1"/></pattern></defs><rect x="1" y="1" width="1118" height="518" rx="14" fill="#fff" stroke="#d0dce6" stroke-width="1.5"/><rect x="26" y="26" width="6" height="50" rx="2" fill="#2c608c" stroke="none" stroke-width="1.5"/><text x="46" y="52" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#26384b">Pod slots and IP addresses are separate budgets</text><text x="46" y="82" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Same numeric scale; the IP row assumes one address per Pod</text><path d="M40 105L1080 105" fill="none" stroke="#dce5ed" stroke-width="1"/><text x="48" y="143" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#26384b">Scheduler slots</text><text x="48" y="200" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#26384b">Old limit</text><rect x="280" y="170" width="672.98" height="43" rx="4" fill="url(#unused)" stroke="#cad8e5" stroke-width="1.5"/><rect x="280" y="170" width="273.98" height="43" rx="0" fill="#317db4" stroke="none" stroke-width="1.5"/><rect x="553.98" y="170" width="18.62" height="43" rx="0" fill="#b5d7cc" stroke="none" stroke-width="1.5"/><path d="M572.6 165L572.6 220" fill="none" stroke="#394f62" stroke-width="2"/><text x="416.99" y="198" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">103</text><text x="985" y="198" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#28644c">7 free</text><text x="572.6" y="160" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#26384b">110</text><text x="48" y="275" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#26384b">New limit</text><rect x="280" y="245" width="672.98" height="43" rx="4" fill="url(#unused)" stroke="#cad8e5" stroke-width="1.5"/><rect x="280" y="245" width="273.98" height="43" rx="0" fill="#317db4" stroke="none" stroke-width="1.5"/><rect x="553.98" y="245" width="311.22" height="43" rx="0" fill="#b5d7cc" stroke="none" stroke-width="1.5"/><path d="M865.2 240L865.2 295" fill="none" stroke="#394f62" stroke-width="2"/><text x="416.99" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">103</text><text x="709.59" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#234d3f">117 free</text><text x="865.2" y="235" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#26384b">220</text><text x="48" y="323" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#26384b">Address budget</text><text x="48" y="375" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#26384b">Example /24</text><rect x="280" y="344" width="672.98" height="43" rx="0" fill="#f1d09a" stroke="#c69b55" stroke-width="1.5"/><rect x="280" y="344" width="585.2" height="43" rx="0" fill="#7896b0" stroke="none" stroke-width="1.5"/><text x="572.6" y="372" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">220 hypothetical IP users</text><text x="909.09" y="372" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#5b4020">33</text><text x="952.98" y="337" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#26384b">253</text><text x="48" y="434" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#26384b">93.6% → 46.8%</text><text x="48" y="465" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">At the same reference count of 103</text><text x="571" y="434" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#26384b">253 − 220 = 33</text><text x="571" y="465" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Illustrative reserve, not measured free IPs</text><path d="M40 481L1080 481" fill="none" stroke="#dce5ed" stroke-width="1"/><text x="46" y="507" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#61758b">Analytical example · not production telemetry</text></svg>
