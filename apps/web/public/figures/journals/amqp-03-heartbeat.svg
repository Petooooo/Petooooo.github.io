<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img" aria-label="Heartbeat is not a job execution timeout"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="623" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Heartbeat is not a job execution timeout</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Negotiation example; not the historical Pika negotiated value</text><rect x="40" y="115" width="500" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="290.0" y="160.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Server proposal: 86400 s</text><rect x="580" y="115" width="500" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="160.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Client proposal: 60 s</text><path d="M290 191V219H560V250" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M830 191V219H560" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="250" width="600" height="76" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="279" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Documented algorithm: 60 s</text><text x="560.0" y="304" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Pika can override the proposal</text><text x="40" y="375" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Heartbeat traffic interval (illustrative)</text><path d="M100 423H1020" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><circle cx="100" cy="423" r="7" fill="#79a58b" stroke="#5e7387"/><text x="100" y="454" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#253c51">0 s</text><circle cx="390" cy="423" r="7" fill="#79a58b" stroke="#5e7387"/><text x="390" y="454" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#253c51">30 s</text><circle cx="680" cy="423" r="7" fill="#79a58b" stroke="#5e7387"/><text x="680" y="454" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#253c51">60 s</text><circle cx="970" cy="423" r="7" fill="#79a58b" stroke="#5e7387"/><text x="970" y="454" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#253c51">90 s</text><rect x="40" y="500" width="1040" height="74" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="530" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Delivery age / application runtime: separate clock</text><text x="60" y="555" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">A live connection can carry a long unacknowledged delivery.</text><text x="40" y="608" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical packet trace</text></svg>
