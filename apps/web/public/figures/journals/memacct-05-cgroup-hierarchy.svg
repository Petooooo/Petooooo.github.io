<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="564" viewBox="0 0 1120 564" role="img" aria-label="Hierarchy and memory-charge boundaries"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="562" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Hierarchy and memory-charge boundaries</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Synthetic subtree, not the host cgroup configuration</text><rect x="345" y="115" width="430" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="560.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Example parent: 900 MiB</text><text x="560.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Includes descendants</text><rect x="40" y="255" width="470" height="77" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="275.0" y="284" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Pod A: 500 MiB</text><text x="275.0" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Parent-local charge assumed zero</text><rect x="610" y="255" width="470" height="77" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="845.0" y="284" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Other service: 400 MiB</text><text x="845.0" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Outside selected Pod subtree</text><path d="M560 190V220H275V255" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M560 220H845V255" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="390" width="225" height="74" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="152.5" y="419" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Container A1</text><text x="152.5" y="444" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">300 MiB</text><rect x="285" y="390" width="225" height="74" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="397.5" y="419" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Container A2</text><text x="397.5" y="444" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">200 MiB</text><path d="M275 332V365H152V390" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M275 365H397V390" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="390" width="470" height="74" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="845.0" y="419" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Shared page charge</text><text x="845.0" y="444" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Not divided by PSS rule</text><path d="M845 332V390" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="40" y="515" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Correct parent total: 900 MiB; parent + descendants would double-count charges.</text><text x="40" y="547" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a historical memory inventory</text></svg>
