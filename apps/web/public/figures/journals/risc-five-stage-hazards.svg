<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740" role="img" aria-labelledby="title desc">
<title id="title">RISC TOY pipeline and forwarding paths</title>
<desc id="desc">Five-stage RTL pipeline from fetch to register write, with branch target feedback, MEM ALU forwarding, WB ALU forwarding, load-result bypass and two distinct stall controls.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1524"/><stop offset="1" stop-color="#112039"/></linearGradient>
 <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5fd3d0"/></marker>
 <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b49cfa"/></marker>
 <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f4b875"/></marker>
 <style>
 text{font-family:Inter,'Noto Sans KR','Segoe UI',sans-serif;fill:#e0eaf7}
 .title{font-size:32px;font-weight:760;fill:#f3f8ff}
 .sub{font-size:18px;fill:#a3bbce}
 .stage{font-size:25px;font-weight:770;fill:#f5faff}
 .feature{font-size:16px;fill:#d5e5f6}
 .small{font-size:14px;fill:#9fbbd1}
 .legend{font-size:18px;font-weight:690;fill:#f4faff}
 .cap{font-size:17px;fill:#b9d0e2}
 .label{font-size:16px;fill:#c7eaf2}
 </style>
</defs>
<rect width="1320" height="740" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1318" height="738" rx="21" fill="none" stroke="#2c445e" stroke-width="2"/>
<text class="title" x="52" y="67">RISC TOY · Pipeline and bypass paths</text>
<text class="sub" x="53" y="106">Instruction flow and control signals from the original 2024 RTL design</text>
<path d="M53 135H1267" stroke="#33485f" stroke-width="2"/>
<!-- Branch feedback -->
<path d="M677 235V185H156V237" fill="none" stroke="#f4b875" stroke-width="3" marker-end="url(#arrow-orange)"/>
<rect x="316" y="162" width="255" height="31" rx="15" fill="#283243"/>
<text class="label" x="443" y="184" text-anchor="middle" fill="#ffc88a">BRANCH target → PC</text>
<!-- Stages -->
<g>
 <rect x="53" y="239" width="218" height="158" rx="17" fill="#192c40" stroke="#4e8caa" stroke-width="2"/>
 <rect x="299" y="239" width="218" height="158" rx="17" fill="#172d40" stroke="#4e8caa" stroke-width="2"/>
 <rect x="545" y="239" width="218" height="158" rx="17" fill="#172e40" stroke="#5fc7b7" stroke-width="2"/>
 <rect x="791" y="239" width="218" height="158" rx="17" fill="#172d40" stroke="#4e8caa" stroke-width="2"/>
 <rect x="1037" y="239" width="230" height="158" rx="17" fill="#182a42" stroke="#8e81c5" stroke-width="2"/>
 <text x="75" y="278" class="stage">IF · Fetch</text>
 <text x="75" y="311" class="feature">PC / instruction</text>
 <text x="75" y="337" class="small">IREQ · INST_M</text>
 <text x="75" y="367" class="small">PC + 4 or target</text>
 <text x="321" y="278" class="stage">ID · Decode</text>
 <text x="321" y="311" class="feature">Register file</text>
 <text x="321" y="337" class="small">INST · STORE</text>
 <text x="321" y="367" class="small">rb_ADDR / rc_ADDR</text>
 <text x="567" y="278" class="stage">EX · Execute</text>
 <text x="567" y="311" class="feature">ALU / branch</text>
 <text x="567" y="337" class="small">valB · valC</text>
 <text x="567" y="367" class="small">ALU_OUT · BRANCH</text>
 <text x="813" y="278" class="stage">MEM · Access</text>
 <text x="813" y="311" class="feature">Data memory</text>
 <text x="813" y="337" class="small">ALU_OUT_MEM</text>
 <text x="813" y="367" class="small">MOUT / DREQ</text>
 <text x="1059" y="278" class="stage">WB · Register</text>
 <text x="1059" y="311" class="feature">Commit result</text>
 <text x="1059" y="337" class="small">dest / WEN</text>
 <text x="1059" y="367" class="small">*_MA write path</text>
</g>
<!-- forward pipeline -->
<path d="M271 318H298M517 318H544M763 318H790M1009 318H1036" fill="none" stroke="#5fd3d0" stroke-width="3.2" marker-end="url(#arrow-cyan)"/>
<!-- three feedback lanes, from MEM and WB to EX -->
<path d="M901 398V450H624V399" stroke="#5fd3d0" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
<rect x="675" y="430" width="194" height="31" rx="12" fill="#17343d"/>
<text class="label" x="772" y="451" text-anchor="middle">MEM ALU forwarding</text>
<path d="M1136 398V502H674V400" stroke="#b49cfa" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
<rect x="768" y="484" width="192" height="31" rx="12" fill="#322c4a"/>
<text class="label" x="864" y="505" text-anchor="middle">WB ALU forwarding</text>
<path d="M981 399V557H725V399" stroke="#f4b875" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
<rect x="838" y="540" width="159" height="31" rx="12" fill="#3b3026"/>
<text class="label" x="917" y="561" text-anchor="middle">Load: MOUT</text>
<!-- stall signal strip -->
<rect x="53" y="601" width="1214" height="83" rx="13" fill="#12273a" stroke="#3c6177" stroke-width="1.8"/>
<text x="80" y="630" class="legend">Pipeline hold</text>
<text x="80" y="661" class="cap">stall_MEM: 1-cycle load-use hold</text>
<path d="M435 622V666" stroke="#3c6177" stroke-width="2"/>
<text x="460" y="642" class="legend">Branch hold</text>
<text x="460" y="666" class="cap">stall_ID: 1 → 2 → 0 (two cycles)</text>
<path d="M891 622V666" stroke="#3c6177" stroke-width="2"/>
<text x="917" y="640" class="legend">Shared rule</text>
<text x="917" y="665" class="cap">Hold PC and pipeline state</text>
<text x="53" y="717" class="small">Redrawn from the 2024 report · functional control paths, not a cycle-accurate waveform or FPGA routing diagram</text>
</svg>
