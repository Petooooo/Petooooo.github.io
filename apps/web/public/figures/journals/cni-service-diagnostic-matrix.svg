<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Pod and Service packet-path diagnostics</title><desc id="chart-desc">Failure symptoms overlap; these probes discriminate routing, translation, policy, and the resolver</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8" stroke="#8bd0dc" stroke-width="1.8" fill="none"/></marker><pattern id="nodes" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30495d"/></pattern></defs><rect width="1500" height="840" rx="20" fill="#091522"/><text x="42" y="59" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="31" font-weight="740" text-anchor="start" fill="#f1f8fc">Pod and Service packet-path diagnostics</text><text x="42" y="98" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#a4c1d2">Failure symptoms overlap; these probes discriminate routing, translation, policy, and the resolver</text><path d="M42 121H1458" stroke="#355265" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="154" width="1404" height="602" rx="15" fill="#102639" stroke="#3b5a6b" stroke-width="1.6"/><text x="73" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#d9ecf6">What each comparison can narrow</text><text x="73" y="226" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#aac3d3">Testing the right protocol and address distinguishes layers; it does not automatically prove the cause.</text><rect x="73" y="260" width="1350" height="61" rx="6" fill="#284052" stroke="#284052" stroke-width="0"/><text x="94" y="299" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#eff9fc">Controlled observation</text><text x="625" y="299" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#eff9fc">If it works</text><text x="1008" y="299" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#eff9fc">If it fails</text><rect x="73" y="326" width="1350" height="64" rx="0" fill="#193245" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="339" width="7" height="37" rx="3" fill="#71c8df" stroke="#71c8df" stroke-width="0"/><text x="108" y="366" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">Direct backend Pod IP</text><path d="M606 337V378" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="365" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Some direct datapath works</text><path d="M990 337V378" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="365" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">CNI / route / policy / endpoint</text><rect x="73" y="391" width="1350" height="64" rx="0" fill="#152c3c" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="404" width="7" height="37" rx="3" fill="#83dab9" stroke="#83dab9" stroke-width="0"/><text x="108" y="431" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">ClusterIP to Service endpoint</text><path d="M606 402V443" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="430" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Service path works for source</text><path d="M990 402V443" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="430" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">Service proxy / filter / endpoints</text><rect x="73" y="456" width="1350" height="64" rx="0" fill="#193245" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="469" width="7" height="37" rx="3" fill="#eac17b" stroke="#eac17b" stroke-width="0"/><text x="108" y="496" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">DNS UDP or TCP query</text><path d="M606 467V508" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="495" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Resolver answered via protocol</text><path d="M990 467V508" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="495" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">Transport or DNS application</text><rect x="73" y="521" width="1350" height="64" rx="0" fill="#152c3c" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="534" width="7" height="37" rx="3" fill="#819ee0" stroke="#819ee0" stroke-width="0"/><text x="108" y="561" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">Same-node vs cross-node</text><path d="M606 532V573" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="560" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Sample route/overlay works</text><path d="M990 532V573" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="560" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">Node/path-dependent difference</text><rect x="73" y="586" width="1350" height="64" rx="0" fill="#193245" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="599" width="7" height="37" rx="3" fill="#a3d3ce" stroke="#a3d3ce" stroke-width="0"/><text x="108" y="626" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">Matching NAT rule counters</text><path d="M606 597V638" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="625" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Expected chain saw traffic</text><path d="M990 597V638" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="625" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">Rule may not see this packet</text><rect x="73" y="651" width="1350" height="64" rx="0" fill="#152c3c" stroke="#2c4e62" stroke-width="0.8"/><rect x="86" y="664" width="7" height="37" rx="3" fill="#cea8b9" stroke="#cea8b9" stroke-width="0"/><text x="108" y="691" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#dfeef7">Conntrack and return state</text><path d="M606 662V703" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="625" y="690" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b9ddcb">Sampled state and counters</text><path d="M990 662V703" stroke="#305066" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1008" y="690" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#edceaf">Inspect drops and limits</text><text x="91" y="739" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#a7bdcd">Rows are diagnostic choices, not success/failure measurements from the recorded incident.</text><path d="M42 780H1458" stroke="#355265" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="812" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#a9c0cc">No invented measurements. NAT, conntrack and firewall defects remain unverified hypotheses in this case.</text></svg>