<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="564" viewBox="0 0 1120 564" role="img" aria-label="I/O attribution across observation scopes"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="562" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">I/O attribution across observation scopes</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Synthetic arithmetic examples; no historical device benchmark</text><rect x="40" y="115" width="320" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="200.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Task accounting</text><text x="200.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">pidstat / proc PID io</text><rect x="400" y="115" width="320" height="75" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Filesystem work</text><text x="560.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Writeback / JBD2</text><rect x="760" y="115" width="320" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="920.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Device accounting</text><text x="920.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-ancho