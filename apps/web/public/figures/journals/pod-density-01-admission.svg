<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565" role="img" aria-label="Two independent admission boundaries"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#738da5"/></marker><pattern id="unused" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#c6d5e1" stroke-width="1"/></pattern></defs><rect x="1" y="1" width="1118" height="563" rx="14" fill="#fff" stroke="#d0dce6" stroke-width="1.5"/><rect x="26" y="26" width="6" height="50" rx="2" fill="#2c608c" stroke="none" stroke-width="1.5"/><text x="46" y="52" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#26384b">Two independent admission boundaries</text><text x="46" y="82" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Binding a Pod does not guarantee a usable network sandbox</text><path d="M40 105L1080 105" fill="none" stroke="#dce5ed" stroke-width="1"/><rect x="48" y="128" width="1024" height="166" rx="10" fill="#f3f7fb" stroke="#d7e3ec" stroke-width="1.5"/><text x="68" y="156" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#26384b">Scheduling boundary</text><rect x="70" y="175" width="222" height="82" rx="9" fill="#edf4fa" stroke="#91adc3" stroke-width="1.5"/><text x="181.0" y="206" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#26384b">Pending Pod</text><text x="181.0" y="234" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#26384b">Pod object</text><rect x="343" y="175" width="345" height="82" rx="9" fill="#edf4fa" stroke="#91adc3" stroke-width="1.5"/><text x="515.5" y="206" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#26384b">Scheduler</text><text x="515.5" y="234" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#26384b">Slots + requests + placement</text><rect x="747" y="175" width="302" height="82" rx="9" fill="#e7f4ed" stroke="#8eb6a0" stroke-width="1.5"/><text x="898.0" y="206" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#26384b">Bound to node</text><text x="898.0" y="234" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#26384b">spec.nodeName</text><path d="M292 216L343 216" fill="none" stroke="#738da5" stroke-width="2" marker-end="url(#arrow)"/><path d="M688 216L747 216" fill="none" stroke="#738da5" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="282" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#a74639">Too many pods → FailedScheduling</text><rect x="48" y="318" width="1024" height="190" rx="10" fill="#f5f8f7" stroke="#d7e3dd" stroke-width="1.5"/><text x="68" y="346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#26384b">Sandbox and networking boundary</text><rect x="70" y="365" width="222" height="82" rx="9" fill="#edf4fa" stroke="#91adc3" stroke-width="1.5"/><text x="181.0" y="396" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#26384b">Kubelet / CRI</text><text x="181.0" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#26384b">Create sandbox</text><rect x="343" y="365" width="345" height="82" rx="9" fill="#edf4fa" stroke="#91adc3" stroke-width="1.5"/><text x="515.5" y="396" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="mi