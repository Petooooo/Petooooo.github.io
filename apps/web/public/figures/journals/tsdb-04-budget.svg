<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-label="Disk headroom and label cardinality"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="538" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Disk headroom and label cardinality</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Independent hypothetical calculations; no historical usage inferred</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Hypothetical 50 GiB filesystem</text><rect x="40" y="155" width="665.6" height="65" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="372.8" y="181" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#253c51">Blocks</text><text x="372.8" y="202" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#253c51">32</text><rect x="705.6" y="155" width="166.4" height="65" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="788.8000000000001" y="181" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#253c51">WAL / Head</text><text x="788.8000000000001" y="202" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#253c51">8</text><rect x="872.0" y="155" width="145.6" height="65" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="944.8" y="181" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#253c51">Output</text><text x="944.8" y="202" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#253c51">7</text><rect x="1017.6" y="155" width="62.4" height="65" rx="7" fill="#f6dfda" stroke="#a9bbc9"/><text x="1048.8" y="181" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#253c51">Free</text><text x="1048.8" y="202" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#253c51">3</text><text x="40" y="255" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">47 GiB used; another 4 GiB exceeds the 50 GiB budget.</text><text x="40" y="332" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Series identities: possible combinations</text><rect x="40" y="360" width="500" height="80" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="290.0" y="389" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">10 × 4 × 5 = 200</text><text x="290.0" y="414" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Host × operation × status</text><rect x="580" y="360" width="500" height="80" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="830.0" y="389" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">200 × 1000 = 200,000</text><text x="830.0" y="414" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Add request-ID values</text><text x="40" y="490" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Cardinality is a possible upper bound, not a measured active-series count.</text><text x="40" y="523" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Teaching model · not historical measurements</text></svg>
