<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Git owns the request, not the signing key"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1727"/><stop offset="1" stop-color="#132b42"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#72b6d6"/></marker></defs><rect width="1280" height="720" rx="22" fill="url(#bg)"/><text x="47" y="65" text-anchor="start" fill="#f5f9ff" font-size="32" font-weight="750" font-family="Inter,Noto Sans KR,Arial,sans-serif">Git owns the request, not the signing key</text><text x="48" y="104" text-anchor="start" fill="#96b9d4" font-size="17" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">Certificate declaration, issuance, and client trust are separate</text><path d="M48 130H1232" stroke="#31516b"/><rect x="68" y="189" width="490" height="411" rx="17" fill="#12263a" stroke="#345775" stroke-width="1.5"/><rect x="623" y="189" width="585" height="411" rx="17" fill="#12263a" stroke="#345775" stroke-width="1.5"/><text x="94" y="232" text-anchor="start" fill="#79ddca" font-size="21" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">GIT / DECLARED STATE</text><rect x="99" y="279" width="423" height="104" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="103" y="291" width="5" height="80" rx="3" fill="#74d6c7"/><text x="120" y="314" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">Certificate manifest</text><text x="120" y="340" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">issuerRef + SAN + secretName</text><text x="99" y="464" text-anchor="start" fill="#efca8b" font-size="19" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">The root CA private key is NOT in Git</text><text x="649" y="232" text-anchor="start" fill="#85cced" font-size="21" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">CONTROLLERS / ACTUAL STATE</text><rect x="662" y="271" width="226" height="87" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="666" y="283" width="5" height="63" rx="3" fill="#74d6c7"/><text x="683" y="306" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">cert-manager</text><text x="683" y="332" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Reconcile</text><rect x="958" y="271" width="216" height="87" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="962" y="283" width="5" height="63" rx="3" fill="#f3c784"/><text x="979" y="306" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">CA Issuer</text><text x="979" y="332" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Sign leaf</text><rect x="797" y="438" width="323" height="93" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="801" y="450" width="5" height="69" rx="3" fill="#74d6c7"/><text x="818" y="473" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">Kubernetes TLS Secret</text><text x="818" y="499" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">tls.crt + tls.key</text><path d="M558 333L648 333" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M888 316L944 316" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1063 358V424H959" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="80" y="639" text-anchor="start" fill="#dce7f6" font-size="19" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">Client trust stores must separately trust the CA</text><path d="M48 665H1232" stroke="#31516b"/><text x="48" y="695" text-anchor="start" fill="#91abc1" font-size="16" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">Simplified technical illustration; example identifiers only</text></svg>
