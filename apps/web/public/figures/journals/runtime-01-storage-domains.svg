<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="522" viewBox="0 0 1120 522" role="img" aria-label="Storage belongs to different runtime owners"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="520" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Storage belongs to different runtime owners</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Persistent root and transient state must not be conflated</text><rect x="40" y="115" width="510" height="310" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="147" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">containerd persistent root</text><rect x="60" y="168" width="470" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Content blobs</text><text x="295.0" y="222" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Compressed image data</text><rect x="60" y="252" width="470" height="70" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="295.0" y="281" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Snapshotter</text><text x="295.0" y="306" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Applied layers and writable data</text><rect x="60" y="336" width="470" height="70" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="295.0" y="365" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Metadata databases</text><text x="295.0" y="390" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Image and snapshot references</text><rect x="590" y="115" width="490" height="310" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="610" y="147" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Runtime and other owners</text><rect x="610" y="168" width="450" height="70" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="835.0" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">containerd state</text><text x="835.0" y="222" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Sockets, task state, mounts</text><rect x="610" y="252" width="450" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="835.0" y="281" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Kubelet root</text><text x="835.0" y="306" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Pod state and mount targets</text><rect x="610" y="336" width="450" height="70" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="835.0" y="365" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Volume data</text><text x="835.0" y="390" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">CSI / local-path / hostPath</text><text x="40" y="470" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">A copied blob store is not a complete snapshot graph or volume backup.</text><text x="40" y="505" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical node inventory</text></svg>
