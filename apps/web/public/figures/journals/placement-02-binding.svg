<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="575" viewBox="0 0 1120 575" role="img" aria-label="Local storage binding and placement"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="573" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Local storage binding and placement</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Delayed provisioning is not migration</text><rect x="40" y="115" width="500" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="290.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Pending PVC / first consumer</text><text x="290.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">WaitForFirstConsumer</text><rect x="580" y="115" width="500" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Scheduler constraints</text><text x="830.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">CPU / affinity / topology</text><path d="M540 153H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="250" width="600" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="560.0" y="279" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Provision and bind local PV</text><text x="560.0" y="304" f