<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-label="Path redirection does not move data by itself"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="608" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Path redirection does not move data by itself</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Configuration, symbolic links and bind attachments</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Method</text><text x="340" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Lookup / attachment</text><text x="790" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Target storage</text><rect x="40" y="155" width="270" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="175.0" y="201.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Explicit path</text><path d="M310 194H340" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="155" width="420" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="550.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Configured new path</text><text x="550.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">/data/runtime</text><path d="M760 194H790" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="155" width="290" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="935.0" y="201.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Data filesystem</text><rect x="40" y="260" width="270" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="175.0" y="306.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Symbolic link</text><path d="M310 299H340" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="260" width="420" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="550.0" y="289" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Resolve stored pathname</text><text x="550.0" y="314" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">alias → /data/runtime</text><path d="M760 299H790" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="260" width="290" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="935.0" y="306.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Data filesystem</text><rect x="40" y="365" width="270" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="175.0" y="411.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Bind mount</text><path d="M310 404H340" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="365" width="420" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="550.0" y="394" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Attach existing subtree</text><text x="550.0" y="419" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Mount namespace entry</text><path d="M760 404H790" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="365" width="290" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="935.0" y="411.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Data filesystem</text><rect x="40" y="480" width="1040" height="80" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="511" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">If the data mount is absent, a path may resolve on the system disk.</text><text x="60" y="539" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Verify the backing mount identity, not just existence of the directory.</text><text x="40" y="593" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical node inventory</text></svg>
