ze="15" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#b6cbd9">Role boundaries, not a deployment status table. A checkmark denotes responsibility, not verified incident behavior.</text></svg>