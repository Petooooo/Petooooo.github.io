<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 870" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">External exposure has several independent owners</title><desc id="fig-desc">A capability matrix separates VIP address control, host-port allocation and backend serving</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#7cc5d2" stroke-width="1.7"/></marker><pattern id="hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="13" height="13" fill="#473646"/><path d="M0 0H13" stroke="#ad7894" stroke-width="3"/></pattern></defs><rect width="1500" height="870" rx="18" fill="#091522"/><text x="45" y="58" font-size="32" font-weight="740" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#f2faff">External exposure has several independent owners</text><text x="45" y="98" font-size="18" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#acc9d9">A capability matrix separates VIP address control, host-port allocation and backend serving</text><path d="M44 121H1456" fill="none" stroke="#3a5368" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="158" width="1410" height="607" rx="16" fill="#102438" stroke="#36566b" stroke-width="1.4" opacity="1"/><text x="70" y="194" font-size="20" font-weight="680" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#d6eaf6">One Service type, different resource owners</text><text x="70" y="226" font-size="17" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#abc7d9">These capabilities should not be mistaken for one interchangeable load balancer.</text><rect x="303" y="249" width="196" height="81" rx="7" fill="#1c3c50" stroke="#365e76" stroke-width="1.4" opacity="1"/><text x="401.0" y="283" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#d7f1fc">VIP allocation</text><text x="401.0" y="309" font-size="13" font-weight="460" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a1bfce">address selection</text><rect x="508" y="249" width="196" height="81" rx="7" fill="#1c3c50" stroke="#365e76" stroke-width="1.4" opacity="1"/><text x="606.0" y="283" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#d7f1fc">VIP announcement</text><text x="606.0" y="309" font-size="13" font-weight="460" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a1bfce">L2 / BGP reachability</text><rect x="713" y="249" width="196" height="81" rx="7" fill="#1c3c50" stroke="#365e76" stroke-width="1.4" opacity="1"/><text x="811.0" y="283" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#d7f1fc">Host port P</text><text x="811.0" y="309" font-size="13" font-weight="460" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a1bfce">pod hostPort request</text><rect x="918" y="249" width="196" height="81" rx="7" fill="#1c3c50" stroke="#365e76" stroke-width="1.4" opacity="1"/><text x="1016.0" y="283" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#d7f1fc">Service delivery</text><text x="1016.0" y="309" font-size="13" font-weight="460" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a1bfce">ClusterIP / backend</text><rect x="1123" y="249" width="196" height="81" rx="7" fill="#1c3c50" stroke="#365e76" stroke-width="1.4" opacity="1"/><text x="1221.0" y="283" font-size="17" font-weight="650" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#d7f1fc">Application</text><text x="1221.0" y="309" font-size="13" font-weight="460" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#a1bfce">request handling</text><rect x="67" y="345" width="1328" height="69" rx="5" fill="#1a3344" stroke="#294b62" stroke-width="1" opacity="1"/><text x="87" y="374" font-size="18" font-weight="680" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#eff9fc">MetalLB controller</text><text x="87" y="400" font-size="13" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#aec7d5">Allocates eligible external address</text><circle cx="401.0" cy="379" r="17" fill="#205c52" stroke="#80dbb8" stroke-width="2"/><text x="401.0" y="385" font-size="20" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#80dbb8">✓</text><circle cx="606.0" cy="379" r="5" fill="#41586a" stroke="#41586a" stroke-width="1"/><circle cx="811.0" cy="379" r="5" fill="#41586a" stroke="#41586a" stroke-width="1"/><circle cx="1016.0" cy="379" r="5" fill="#41586a" stroke="#41586a" stroke-width="1"/><circle cx="1221.0" cy="379" r="5" fill="#41586a" stroke="#41586a" stroke-width="1"/><rect x="67" y="419" width="1328" height="69" rx="5" fill="#172d3d" stroke="#294b62" stroke-width="1" opacity="1"/><text x="87" y="448" font-size="18" font-weight="680" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#eff9fc">MetalLB speaker</text><text x="87" y="474" font-size="13" font-weight="500" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="start" fill="#aec7d5">Announces the assigned address</text><circle cx="401.0" cy="453" r="5" fill="#41586a" stroke="#41586a" stroke-width="1"/><circle cx="606.0" cy="453" r="17" fill="#205c52" stroke="#80dbb8" stroke-width="2"/><text x="606.0" y="459" font-size="20" font-weight="730" font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle" fill="#80dbb8">✓</text><circle cx="811.0" cy="453" r="5" fill="#41586a" str