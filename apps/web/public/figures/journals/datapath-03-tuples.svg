<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="563" viewBox="0 0 1120 563" role="img" aria-label="One Service exchange, four packet tuples"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="561" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">One Service exchange, four packet tuples</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Documentation-only IP addresses; no source NAT in this example</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Observation point</text><text x="400" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Source tuple</text><text x="760" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Destination tuple</text><rect x="40" y="154" width="1040" height="69" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="56" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">1. Client request</text><text x="400" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start" fill="#253c51">192.0.2.10:40000</text><text x="760" y="197" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start" fill="#253c51">198.51.100.53:53</text><rect x="40" y="235" width="1040" height="69" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><rect x="742" y="241" width="328" height="57" rx="4" fill="#f4