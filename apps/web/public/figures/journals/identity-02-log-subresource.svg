<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-label="Pod access is not automatically log access"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7893a9"/></marker></defs><rect x="1" y="1" width="1118" height="533" rx="7" fill="#fff" stroke="#d0dce6"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#26394b">Pod access is not automatically log access</text><text x="40" y="78" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Hypothetical read-only observer; not a complete Runner role</text><text x="40" y="125" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">API request</text><text x="505" y="125" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Required resource and verb</text><text x="950" y="125" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Example</text><rect x="40" y="143" width="1040" height="46" rx="7" fill="#f2f7fa" stroke="#dbe4eb"/><text x="55" y="172" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">List Pod names</text><text x="505" y="172" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">pods · list</text><text x="985" y="172" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#276748">Allow</text><rect x="40" y="197" width="1040" height="46" rx="7" fill="#fff" stroke="#dbe4eb"/><text x="55" y="226" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Read one Pod</text><text x="505" y="226" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">pods · get</text><text x="985" y="226" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#276748">Allow</text><rect x="40" y="251" width="1040" height="46" rx="7" fill="#f2f7fa" stroke="#dbe4eb"/><text x="55" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Read container logs</text><text x="505" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">pods/log · get</text><text x="985" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#276748">Allow</text><rect x="40" y="305" width="1040" height="46" rx="7" fill="#fff" stroke="#dbe4eb"/><text x="55" y="334" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Read Secret</text><text x="505" y="334" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">secrets · get</text><text x="985" y="334" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#a34437">Deny</text><rect x="40" y="359" width="1040" height="46" rx="7" fill="#f2f7fa" stroke="#dbe4eb"/><text x="55" y="388" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Execute a command</text><text x="505" y="388" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">pods/exec · create</text><text x="985" y="388" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#a34437">Deny</text><rect x="40" y="413" width="1040" height="46" rx="7" fill="#fff" stroke="#dbe4eb"/><text x="55" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Delete Pod</text><text x="505" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">pods · delete</text><text x="985" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#a34437">Deny</text><text x="40" y="490" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#26394b">Assumes no other matching grants; Kubernetes RBAC permissions are additive.</text><text x="40" y="519" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#61758b">Illustrative policy model · not deployed permissions</text></svg>
