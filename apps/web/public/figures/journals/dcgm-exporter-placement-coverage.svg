 x="1291" y="645" fill="#d3e6ed" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="520" text-anchor="middle">not eligible</text><text x="88" y="729" fill="#b6d3df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">The lower row is a policy goal, not a verified after-remediation screenshot.</text><path d="M48 771H1452" stroke="#314e62" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="802" fill="#a8c3d0" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Hardware groups and host letters are abstract. No server identity, physical GPU count or final rollout is disclosed.</text></svg>