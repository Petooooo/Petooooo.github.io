<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 827" role="img" aria-labelledby="title desc"><title id="title">A DaemonSet does not imply hardware coverage</title><desc id="desc">One cluster can fail in opposite ways: schedule on unsupported hosts or pin to a single GPU node</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8" fill="none" stroke="#77bfcd" stroke-width="1.7"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#172638"/><path d="M0 0H14" stroke="#365066" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="1500" height="827" rx="20" fill="#091522" stroke="#091522" stroke-width="0"/><text x="48" y="61" fill="#f6fbff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="31" font-weight="730" text-anchor="start">A DaemonSet does not imply hardware coverage</text><text x="48" y="100" fill="#afc9d7" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">One cluster can fail in opposite ways: schedule on unsupported hosts or pin to a single GPU node</text><path d="M48 125H1452" stroke="#314e62" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="150" width="1404" height="601" rx="17" fill="#112539" stroke="#34556c" stroke-width="1.4"/><text x="74" y="196" fill="#d5e9f5" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="730" text-anchor="start">HOST CLASSES</text><rect x="547" y="223" width="198" height="75" rx="8" fill="#20483f" stroke="#8bd4b9" stroke-width="1.4"/><text x="646" y="250" fill="#eff9fc" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="680" text-anchor="middle">GPU NODE A</text><text x="646" y="275" fill="#b5d5de" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="480" text