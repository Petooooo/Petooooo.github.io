<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 855" role="img" aria-labelledby="title desc"><title id="title">An attachment migration needs an identity audit</title><desc id="desc">Audit matrix distinguishes observed new-upload success and historical-download failure from proposed per-file verification and unverified final reconciliation. No real file counts or identifiers.</desc>
