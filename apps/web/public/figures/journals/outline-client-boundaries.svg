<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 950" role="img" aria-labelledby="t d"><title id="t">Independent trust boundaries of a self-hosted wiki</title><desc id="d">Evidence board comparing Outline realtime handshake, browser attachment fetch, GitLab backend userinfo and later callback mismatch. Observations come from different incidents; success of one request does not prove others.</desc><rect width="1440" height="950" fill="#081420"/>
