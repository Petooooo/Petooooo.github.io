<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595" role="img" aria-label="Image recovery is not persistent-data recovery"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="593" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Image recovery is not persistent-data recovery</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Recovery checks depend on who owns the data</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Data class</text><text x="340" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Recovery responsibility</text><text x="740" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Required evidence</text><rect x="40" y="153" width="1040" height="75" rx="7" fill="#e3edf6" stroke="#c0d0dd"/><text x="55" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Content blobs</text><text x="340" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Recover trusted artifact</text><text x="740" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Expected digest available</text><rect x="40" y="242" width="1040" height="75" rx="7" fill="#e0eee4" stroke="#c0d0dd"/><text x="55" y="285" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Committed snapshot</text><text x="340" y="285" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Reconstruct applied layers</text><text x="740" y="285" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Usable parent chain</text><rect x="40" y="331" width="1040" height="75" rx="7" fill="#f4e8ce" stroke="#c0d0dd"/><text x="55" y="374" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Active writable layer</text><text x="340" y="374" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Preserve unique changes</text><text x="740" y="374" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Rootfs state checked</text><rect x="40" y="420" width="1040" height="75" rx="7" fill="#f4e8ce" stroke="#c0d0dd"/><text x="55" y="463" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Persistent volume</text><text x="340" y="463" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Separate storage lifecycle</text><text x="740" y="463" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#253c51">Mount and data verified</text><text x="40" y="547" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Do not recreate a missing layer as an empty directory or delete live references.</text><text x="40" y="578" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a captured runtime trace</text></svg>
