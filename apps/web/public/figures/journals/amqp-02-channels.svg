d="M560 211H830V240" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="365" width="1040" height="58" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="401" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Connection closes: both channels are lost.</text><rect x="40" y="465" width="500" height="82" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="290.0" y="494" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">New generation B / channel B1</text><text x="290.0" y="519" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Tag 1 may be reused</text><rect x="580" y="465" width="500" height="82" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="830.0" y="494" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Old worker callback</text><text x="830.0" y="519" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Reject old delivery context</text><text x="40" y="600" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Delivery tags are not globally unique job identifiers.</text><text x="40" y="633" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical packet trace</text></svg>
