<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="A process boundary changes the design problem"><rect width="1280" height="590" rx="20" fill="#0b1220"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#81d8e9" stroke-width="2"/></marker></defs><text x="42" y="57" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f0f8ff" font-weight="750" >A process boundary changes the design problem</text><text x="42" y="95" font-family="Inter,Arial,sans-serif" font-size="17" fill="#acbdcb" font-weight="500" >Data transfer, resource ownership and synchronization are separate concerns</text><path d="M42 121H1238" stroke="#32475a"/><rect x="43" y="190" width="276" height="292" rx="14" fill="#1b2b40" stroke="#4c829a" stroke-width="1.7"/><text x="60" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >01</text><text x="60" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >Process A</text><text x="60" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Independent memory</text><text x="60" y="384" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Open descriptors</text><text x="60" y="410" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Produce message</text><path d="M323 329H342" stroke="#7cceed" stroke-width="2.5" marker-end="url(#arr)"/><rect x="349" y="190" width="276" height="292" rx="14" fill="#1b3039" stroke="#4c829a" stroke-width="1.7"/><text x="366" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >02</text><text x="366" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >Kernel IPC</text><text x="366" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Pipe / queue / map</text><text x="366" y="384" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Blocking behavior</text><text x="366" y="410" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Buffer ownership</text><path d="M629 329H648" stroke="#7cceed" stroke-width="2.5" marker-end="url(#arr)"/><rect x="655" y="190" width="276" height="292" rx="14" fill="#1b2b40" stroke="#4c829a" stroke-width="1.7"/><text x="672" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >03</text><text x="672" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >Process B</text><text x="672" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Decode framing</text><text x="672" y="384" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Consume message</text><text x="672" y="410" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Close descriptors</text><path d="M935 329H954" stroke="#7cceed" stroke-width="2.5" marker-end="url(#arr)"/><rect x="961" y="190" width="276" height="292" rx="14" fill="#1b3039" stroke="#72dbb5" stroke-width="1.7"/><text x="978" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >04</text><text x="978" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >Coordination</text><text x="978" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Locks / semaphore</text><text x="978" y="384" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Timeout / retry</text><text x="978" y="410" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Lifetime invariants</text><text x="43" y="543" font-family="Inter,Arial,sans-serif" font-size="16" fill="#aec3d1" font-weight="470" >A shared buffer moves data; it does not automatically synchronize readers and writers.</text><text x="1238" y="543" font-family="Inter,Arial,sans-serif" font-size="13" fill="#658498" font-weight="500" text-anchor="end">LEARNING / CONCEPTUAL MODEL</text></svg>