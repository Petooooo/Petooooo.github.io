<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 830" role="img" aria-labelledby="title desc"><title id="title">When the observer runs out of room</title><desc id="desc">Prometheus WAL pressure and a missing time series describe two different kinds of evidence</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8" fill="none" stroke="#77bfcd" stroke-width="1.7"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#172638"/><path d="M0 0H14" stroke="#365066" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="1500" height="830" rx="20" fill="#091522" stroke="#091522" stroke-width="0"/><text x="48" y="61" fill="#f6fbff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="31" font-weight="730" text-anchor="start">When the observer runs out of room</text><text x="48" y="100" fill="#afc9d7" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Prometheus WAL pressure and a missing time series describe two different kinds of evidence</text><path d="M48 125H1452" stroke="#314e62" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="49" y="152" width="1402" height="280" rx="16" fill="#102738" stroke="#2e5369" stroke-width="1.4"/><text x="75" y="190" fill="#d5eaf7" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">A / PROMETHEUS DISK HEADROOM</text><text x="75" y="221" fill="#adcadb" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Not measured proportions: a capacity budget must account for overlapping write-path needs</text><rect x="83" y="268" width="535" height="81" rx="10" fill="#244e66" stroke="#80c2db" stroke-width="1.4"/><text x="350.5" y="301" fill="#f4faff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">TSDB blocks</text><text x="350.5" y="327" fill="#b6d2df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">size not to scale</text><rect x="630" y="268" width="235" height="81" rx="10" fill="#30565a" stroke="#8dd0cb" stroke-width="1.4"/><text x="747.5" y="301" fill="#f4faff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Head / chunks</text><text x="747.5" y="327" fill="#b6d2df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">size not to scale</text><rect x="877" y="268" width="225" height="81" rx="10" fill="#6b4941" stroke="#f2b897" stroke-width="1.4"/><text x="989.5" y="301" fill="#f4faff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">WAL</text><text x="989.5" y="327" fill="#b6d2df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">size not to scale</text><rect x="1114" y="268" width="257" height="81" rx="10" fill="#233e53" stroke="#95b5d2" stroke-width="1.4"/><text x="1242.5" y="301" fill="#f4faff" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Reserve / compaction</text><text x="1242.5" y="327" fill="#b6d2df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">size not to scale</text><text x="81" y="395" fill="#e9cbad" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="540" text-anchor="start">The observed write error was in the WAL path; chart gaps alone cannot prove the same cause.</text><rect x="48" y="455" width="1405" height="302" rx="16" fill="#112539" stroke="#305269" stroke-width="1.4"/><text x="74" y="495" fill="#d9eef6" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="730" text-anchor="start">B / A VALUE OF ZERO IS NOT A MISSING SAMPLE</text><text x="75" y="524" fill="#afcad9" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Schematic query behavior; points and timeline are illustrative rather than historical measurements</text><text x="85" y="596" fill="#a9e6ca" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">SERIES EXISTS</text><text x="85" y="618" fill="#c0d4df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">sample value = 0</text><text x="85" y="690" fill="#efb59b" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">SERIES ABSENT</text><text x="85" y="711" fill="#c0d4df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">gap, not zero</text><path d="M418 586H1382" stroke="#455c6c" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M418 680H1382" stroke="#455c6c" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M551 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M672 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M793 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M914 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M1035 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M1156 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M1277 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M1372 551V729" stroke="#294456" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M430 585H1370" stroke="#7bd8b5" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="551" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="672" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="793" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="914" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="1035" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="1156" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="1277" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><circle cx="1370" cy="585" r="5" fill="#76d8b8" stroke="#defaf0" stroke-width="1"/><path d="M430 679H793" stroke="#e0b49b" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="679" r="5" fill="#d6a287" stroke="#ffe9da" stroke-width="1"/><circle cx="551" cy="679" r="5" fill="#d6a287" stroke="#ffe9da" stroke-width="1"/><circle cx="672" cy="679" r="5" fill="#d6a287" stroke="#ffe9da" stroke-width="1"/><circle cx="793" cy="679" r="5" fill="#d6a287" stroke="#ffe9da" stroke-width="1"/><rect x="808" y="652" width="570" height="53" rx="6" fill="url(#hatch)" stroke="#50647b" stroke-width="1.4"/><text x="1092" y="684" fill="#f9c5af" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="680" text-anchor="middle">NO SAMPLES OBSERVED</text><text x="74" y="741" fill="#b5d1df" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Prometheus staleness semantics can remove a time series from query results; no implied zero.</text><path d="M48 774H1452" stroke="#314e62" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="805" fill="#a8c3d0" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Illustration only: block widths, timestamps and dots are not measurements from the original incident.</text></svg>