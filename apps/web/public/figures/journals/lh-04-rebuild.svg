<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="694" viewBox="0 0 1120 694" role="img" aria-label="Rebuilding is not just a setting"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="692" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Rebuilding is not just a setting</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Simplified V1 sequence; transfer time is a hypothetical lower-bound example</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Rebuild gate</text><text x="600" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">What must be true</text><rect x="40" y="151" width="510" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="189.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Eligible source and destination</text><path d="M550 182H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="151" width="500" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="189.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Capacity and scheduling</text><path d="M295 213V226" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="226" width="510" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="264.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Attach for offline rebuild</text><path d="M550 257H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="226" width="500" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="264.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Detached degraded volume</text><path d="M295 288V301" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="301" width="510" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="339.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Add target in WO mode</text><path d="M550 332H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="301" width="500" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="339.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Establish snapshot reference</text><path d="M295 363V376" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="376" width="510" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="295.0" y="414.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Synchronize snapshot data</text><path d="M550 407H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="376" width="500" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="414.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Coordinate concurrent writes</text><path d="M295 438V451" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="451" width="510" height="62" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="295.0" y="489.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Promote to RW after success</text><path d="M550 482H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="451" width="500" height="62" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="489.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Verify usable replica set</text><rect x="40" y="552" width="1040" height="92" rx="7" fill="#f4e8ce" stroke="#c4aa77"/><text x="60" y="581" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Illustrative transfer of 4 TiB</text><text x="60" y="618" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">100 MiB/s ≈ 11.65 h</text><text x="580" y="618" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">50 MiB/s ≈ 23.30 h</text><text x="40" y="677" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual V1 model · not a historical volume inventory</text></svg>
