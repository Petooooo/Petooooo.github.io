<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="607" viewBox="0 0 1120 607" role="img" aria-label="From device errors to filesystem symptoms"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="605" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">From device errors to filesystem symptoms</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Possible propagation, not a recorded causal sequence</text><rect x="40" y="115" width="330" height="78" rx="7" fill="#f6dfda" stroke="#a9bbc9"/><text x="205.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Block I/O error</text><text x="205.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Device or array path</text><rect x="395" y="115" width="330" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Filesystem policy</text><text x="560.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Possible read-only mount</text><rect x="750" y="115" width="330" height="78" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="915.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Application write</text><text x="915.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Failure or delayed error</text><path d="M370 154H395" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><path d="M725 154H750" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="40" y="243" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Error category</text><text x="360" y="243" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">What it indicates</text><rect x="40" y="262" width="1040" height="54" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="296" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">EIO</text><text x="360" y="296" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Input/output error</text><rect x="40" y="326" width="1040" height="54" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="360" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">EROFS</text><text x="360" y="360" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Read-only filesystem</text><rect x="40" y="390" width="1040" height="54" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">ENOSPC</text><text x="360" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">No space available</text><rect x="40" y="454" width="1040" height="54" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="488" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">EACCES</text><text x="360" y="488" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Permission denied</text><text x="40" y="557" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">An application-level read-only state is a separate observation.</text><text x="40" y="590" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual model · not a historical device inventory</text></svg>
