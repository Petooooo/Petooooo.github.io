<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="Identity and authorization belong to different layers"><rect width="1280" height="590" rx="20" fill="#0b1220"/><path d="M42 123H1238" stroke="#35506a" stroke-width="1"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#72d5ec" stroke-width="1.8"/></marker></defs><text x="42" y="57" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f5faff" font-weight="750" >Identity and authorization belong to different layers</text><text x="42" y="93" font-family="Inter,Arial,sans-serif" font-size="17" fill="#a9becf" font-weight="400" >The cluster API, login session and application object are not the same resource</text><rect x="43" y="184" width="378" height="292" rx="15" fill="#192b42" stroke="#76c9e4" stroke-width="1.7"/><text x="65" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Kubernetes API</text><path d="M65 250H399" stroke="#496375"/><text x="65" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >ServiceAccount identity</text><text x="65" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Role / RoleBinding</text><text x="65" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Verb + namespace scope</text><text x="65" y="389" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Deploy/observe ≠ admin</text><rect x="451" y="184" width="378" height="292" rx="15" fill="#1a3039" stroke="#67ad9d" stroke-width="1.7"/><text x="473" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Application sign-in</text><path d="M473 250H807" stroke="#496375"/><text x="473" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >GitLab OAuth2</text><text x="473" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Keycloak / OIDC option</text><text x="473" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Token / user session</text><text x="473" y="389" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Login ≠ authorization</text><rect x="859" y="184" width="378" height="292" rx="15" fill="#1a3039" stroke="#67ad9d" stroke-width="1.7"/><text x="881" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Domain access</text><path d="M881 250H1215" stroke="#496375"/><text x="881" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >OpenFGA / ReBAC</text><text x="881" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >User – team – object</text><text x="881" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Owner / editor / viewer</text><text x="881" y="389" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Model and integration work</text><text x="42" y="556" font-family="Inter,Arial,sans-serif" font-size="16" fill="#a7bdd1" font-weight="450" >Protect Kubernetes resources with RBAC; handle object-level permissions in the application domain.</text><text x="1238" y="556" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7294a8" font-weight="500" text-anchor="end">CONCEPTUAL · NOT A DEPLOYMENT TOPOLOGY</text></svg>