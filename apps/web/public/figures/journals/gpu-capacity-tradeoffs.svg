<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="gpu-title gpu-desc"><title id="gpu-title">GPU allocation: exclusive, time-sliced and MIG hardware partitioning</title><desc id="gpu-desc">Three conceptual GPU dies. Whole device has one occupant. Time-slicing has one shared GPU memory pool with interleaved A, B and C execution. MIG has three hardware-separated resource instances with independent compute and memory space, on compatible hardware.</desc><defs><pattern id="diegrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#294451" stroke-width=".7"/></pattern></defs><rect x="0" y="0" width="1440" height="840" rx="20" fill="#091421" stroke="#091421" stroke-width="0"/><text x="42" y="60" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="31" font-weight="750" fill="#f2faff">One physical GPU, three different ownership models</text><text x="42" y="94" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" fill="#aac5d4">Kubernetes logical resources do not necessarily correspond to isolated device resources</text><path d="M42 116L1397 116" stroke="#315063" stroke-width="1"  fill="none" /><rect x="42" y="146" width="422" height="552" rx="17" fill="#102333" stroke="#355266" stroke-width="1.5"/><text x="65" y="187" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="750" fill="#55c7b1">WHOLE DEVICE</text><text x="65" y="216" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b3c8d5">Exclusive allocation</text><path d="M64 229L441 229" stroke="#28495b" stroke-width="1"  fill="none" /><rect x="508" y="146" width="422" height="552" rx="17" fill="#102333" stroke="#355266" stroke-width="1.5"/><text x="531" y="187" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="750" fill="#eab87e">TIME-SLICING</text><text x="531" y="216" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b3c8d5">Shared device and VRAM</text><path d="M530 229L907 229" stroke="#28495b" stroke-width="1"  fill="none" /><rect x="974" y="146" width="422" height="552" rx="17" fill="#102333" stroke="#355266" stroke-width="1.5"/><text x="997" y="187" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="750" fill="#81b8f0">MIG</text><text x="997" y="216" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b3c8d5">Hardware instances*</text><path d="M996 229L1373 229" stroke="#28495b" stroke-width="1"  fill="none" /><rect x="93" y="255" width="320" height="285" rx="15" fill="#183949" stroke="#70cbb6" stroke-width="2"/><text x="252" y="287" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" fill="#d9f9f0">PHYSICAL GPU</text><rect x="118" y="310" width="270" height="105" rx="9" fill="#1c695b" stroke="#77dcb8" stroke-width="1.5"/><text x="253" y="356" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" fill="#e1fff1">Compute / SMs</text><text x="253" y="387" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#bee8db">one allocated workload</text><rect x="118" y="431" width="270" height="80" rx="8" fill="#1b5260" stroke="#6bb7c3" stroke-width="1.5"/><text x="253" y="464" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" fill="#e3f7fc">GPU memory</text><text x="253" y="488" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="450" fill="#b6d9e4">reserved by one workload</text><text x="252" y="578" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="550" fill="#c2d7e4">No sharing through this allocation</text><text x="252" y="611" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#9fb9c8">Simple isolation from co-tenant workloads</text><rect x="559" y="255" width="320" height="285" rx="15" fill="#213746" stroke="#deac76" stroke-width="2"/><text x="718" y="287" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" fill="#f5e0c3">SAME PHYSICAL GPU</text><rect x="583" y="308" width="272" height="81" rx="8" fill="#474036" stroke="#cb9d6b" stroke-width="1.5"/><text x="719" y="342" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" fill="#ffe9c9">One shared memory pool</text><text x="719" y="369" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" fill="#e4caaa">A, B and C compete for VRAM</text><text x="583" y="429" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" fill="#d8dfe9">Compute time (schematic)</text><rect x="582" y="446" width="42" height="48" rx="4" fill="#5cbec7" stroke="#5cbec7" stroke-width="0.5"/><text x="603" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">A</text><rect x="628" y="446" width="42" height="48" rx="4" fill="#f2bb82" stroke="#f2bb82" stroke-width="0.5"/><text x="649" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">B</text><rect x="674" y="446" width="42" height="48" rx="4" fill="#977ddd" stroke="#977ddd" stroke-width="0.5"/><text x="695" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">C</text><rect x="720" y="446" width="42" height="48" rx="4" fill="#5cbec7" stroke="#5cbec7" stroke-width="0.5"/><text x="741" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">A</text><rect x="766" y="446" width="42" height="48" rx="4" fill="#f2bb82" stroke="#f2bb82" stroke-width="0.5"/><text x="787" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">B</text><rect x="812" y="446" width="42" height="48" rx="4" fill="#977ddd" stroke="#977ddd" stroke-width="0.5"/><text x="833" y="475" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="750" fill="#102532">C</text><text x="718" y="577" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" fill="#efcda5">Multiple logical GPU requests</text><text x="718" y="610" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#d5a9a2">No hard memory or fault isolation</text><rect x="1025" y="255" width="320" height="285" rx="15" fill="#183848" stroke="#76b6df" stroke-width="2"/><text x="1184" y="287" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" fill="#d4eaff">ONE MIG-CAPABLE GPU</text><rect x="1044" y="307" width="106" height="203" rx="8" fill="#245b69" stroke="#85b8f0" stroke-width="2"/><text x="1097.0" y="339" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#eff8ff">GI 0</text><rect x="1053" y="356" width="88" height="66" rx="6" fill="#3e8b8f" stroke="#6ed4c6" stroke-width="1"/><text x="1097.0" y="382" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#edfff9">SM</text><text x="1097.0" y="401" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#d6f5ec">partition</text><rect x="1053" y="435" width="88" height="59" rx="6" fill="#5a679b" stroke="#9caef4" stroke-width="1"/><text x="1097.0" y="461" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="650" fill="#f5f5ff">VRAM</text><text x="1097.0" y="479" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#dce2ff">slice</text><rect x="1158" y="307" width="70" height="203" rx="8" fill="#314b79" stroke="#85b8f0" stroke-width="2"/><text x="1193.0" y="339" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#eff8ff">GI 1</text><rect x="1167" y="356" width="52" height="66" rx="6" fill="#3e8b8f" stroke="#6ed4c6" stroke-width="1"/><text x="1193.0" y="382" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#edfff9">SM</text><text x="1193.0" y="401" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#d6f5ec">partition</text><rect x="1167" y="435" width="52" height="59" rx="6" fill="#5a679b" stroke="#9caef4" stroke-width="1"/><text x="1193.0" y="461" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="650" fill="#f5f5ff">VRAM</text><text x="1193.0" y="479" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#dce2ff">slice</text><rect x="1236" y="307" width="90" height="203" rx="8" fill="#294e64" stroke="#85b8f0" stroke-width="2"/><text x="1281.0" y="339" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#eff8ff">GI 2</text><rect x="1245" y="356" width="72" height="66" rx="6" fill="#3e8b8f" stroke="#6ed4c6" stroke-width="1"/><text x="1281.0" y="382" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" fill="#edfff9">SM</text><text x="1281.0" y="401" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#d6f5ec">partition</text><rect x="1245" y="435" width="72" height="59" rx="6" fill="#5a679b" stroke="#9caef4" stroke-width="1"/><text x="1281.0" y="461" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="650" fill="#f5f5ff">VRAM</text><text x="1281.0" y="479" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="11" font-weight="450" fill="#dce2ff">slice</text><text x="1184" y="577" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" fill="#b8dafa">Partition profiles have fixed shapes</text><text x="1184" y="610" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#a8c5dd">Separated compute and memory paths</text><path d="M42 722L1398 722" stroke="#365267" stroke-width="1"  fill="none" /><text x="43" y="754" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="700" fill="#f0f7fc">Decision boundary</text><text x="238" y="754" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#c8e1e9">available device memory</text><text x="603" y="754" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#e7c8a0">cross-workload interference</text><text x="1110" y="754" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#badbf8">hardware eligibility</text><text x="43" y="793" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#a7becd">* MIG is an option only on supported devices. Diagram is conceptual, not a deployment map or measured performance comparison.</text></svg>