<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="550" viewBox="0 0 1320 550" role="img" aria-labelledby="title desc">
<title id="title">Convolution progress and input last-use regions</title>
<desc id="desc">Three schematic grid states show an expanding input area after its final use while a sliding-window convolution progresses. Blue means the original input may become dead, yellow means the input must still be protected, and exact safe limits depend on the kernel.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101829"/><stop offset="1" stop-color="#11253a"/></linearGradient></defs>
<rect width="1320" height="550" rx="22" fill="url(#bg)" stroke="#344e67" stroke-width="2"/>
<text x="54" y="69" font-family="Inter, 'Noto Sans KR', Arial" font-weight="750" font-size="33" fill="#f4f9ff">Why convolution creates a last-use region</text>
<text x="54" y="108" font-family="Inter, 'Noto Sans KR', Arial" font-size="19" fill="#a4c0d1">The same tensor may contain both needed and already-consumed input bytes</text>
