<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Certificate fields have different jobs"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1727"/><stop offset="1" stop-color="#132b42"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#72b6d6"/></marker></defs><rect width="1280" height="720" rx="22" fill="url(#bg)"/><text x="47" y="65" text-anchor="start" fill="#f5f9ff" font-size="32" font-weight="750" font-family="Inter,Noto Sans KR,Arial,sans-serif">Certificate fields have different jobs</text><text x="48" y="104" text-anchor="start" fill="#96b9d4" font-size="17" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">Issuer, SANs, Secret, and private key policy</text><path d="M48 130H1232" stroke="#31516b"/><rect x="59" y="173" width="520" height="454" rx="17" fill="#12263a" stroke="#345775" stroke-width="1.5"/><text x="84" y="219" text-anchor="start" fill="#e1ebf6" font-size="21" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">Certificate: apps-https</text><text x="84" y="274" text-anchor="start" fill="#e1ebf6" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">issuerRef: internal-ca-issuer</text><text x="84" y="329" text-anchor="start" fill="#a7e0ce" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">secretName: apps-https-tls</text><text x="84" y="384" text-anchor="start" fill="#e1ebf6" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">commonName: apps.example.test</text><text x="84" y="439" text-anchor="start" fill="#a7e0ce" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">dnsNames: *.apps.example.test</text><text x="84" y="494" text-anchor="start" fill="#a7e0ce" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">ipAddresses: 192.0.2.80</text><text x="84" y="549" text-anchor="start" fill="#e1ebf6" font-size="18" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">RSA 2048 / rotationPolicy: Never</text><rect x="656" y="180" width="547" height="79" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="660" y="192" width="5" height="55" rx="3" fill="#75cfd0"/><text x="677" y="215" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">Issuer identity</text><text x="677" y="241" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Existing CA hierarchy</text><path d="M579 220L640 220" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="656" y="271" width="547" height="79" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="660" y="283" width="5" height="55" rx="3" fill="#75cfd0"/><text x="677" y="306" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">TLS Secret</text><text x="677" y="332" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Certificate + private key</text><path d="M579 311L640 311" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="656" y="362" width="547" height="79" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="660" y="374" width="5" height="55" rx="3" fill="#75cfd0"/><text x="677" y="397" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">DNS SAN</text><text x="677" y="423" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Client hostname, not DNS IP</text><path d="M579 402L640 402" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="656" y="453" width="547" height="79" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="660" y="465" width="5" height="55" rx="3" fill="#75cfd0"/><text x="677" y="488" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">IP SAN</text><text x="677" y="514" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Only for IP-based TLS identity</text><path d="M579 493L640 493" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="656" y="544" width="547" height="79" rx="15" fill="#1b334a" stroke="#4b6b88" stroke-width="1.4"/><rect x="660" y="556" width="5" height="55" rx="3" fill="#efc786"/><text x="677" y="579" text-anchor="start" fill="#f5f9ff" font-size="22" font-weight="700" font-family="Inter,Noto Sans KR,Arial,sans-serif">Never policy</text><text x="677" y="605" text-anchor="start" fill="#afc7db" font-size="15" font-weight="450" font-family="Inter,Noto Sans KR,Arial,sans-serif">Reuses key on renewal</text><path d="M579 584L640 584" stroke="#72b6d6" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M48 665H1232" stroke="#31516b"/><text x="48" y="695" text-anchor="start" fill="#91abc1" font-size="16" font-weight="500" font-family="Inter,Noto Sans KR,Arial,sans-serif">Simplified technical illustration; example identifiers only</text></svg>
