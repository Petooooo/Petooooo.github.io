<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="575" viewBox="0 0 1120 575" role="img" aria-label="Host memory counters are not all additive"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="573" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Host memory counters are not all additive</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Selected fields and overlap relationships</text><rect x="40" y="115" width="490" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="285.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">AnonPages</text><text x="285.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Anonymous resident pages</text><rect x="590" y="115" width="490" height="75" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="835.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">MemAvailable</text><text x="835.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Availability estimate, not a pool</text><rect x="40" y="230" width="490" height="172" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="265" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Cached</text><rect x="60" y="283" width="450" height="82" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="285.0" y="312" font-family="Inter,Noto Sans KR,