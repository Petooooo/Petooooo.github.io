<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="519" viewBox="0 0 1120 519" role="img" aria-label="February 24: rate versus occupied space"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="517" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">February 24: rate versus occupied space</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Sanitized transcription of two reported observations</text><rect x="40" y="120" width="500" height="226" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><rect x="580" y="120" width="500" height="226" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="157" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">Task write rate</text><text x="60" y="213" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="42" font-weight="750" text-anchor="start" fill="#253c51">26122.88</text><text x="60" y="246" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">kB_wr/s (pidstat)</text><text x="60" y="281" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5e7387">≈ 25.51 MiB/s under KiB convention</text><text x="60" y="315" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">One reported sample</text><text x="600" y="157" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">Snapshot directory size</text><text x="600" y="213" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="42" font-weight="750" text-anchor="start" fill="#253c51">≈ 19 GB</text><text x="600" y="246" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Reported occupied space</text><text x="600" y="281" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5e7387">No growth interval retained</text><text x="600" y="315" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Not a write-rate measurement</text><rect x="40" y="385" width="1040" height="83" rx="7" fill="#f4e8ce" stroke="#d3bd8c"/><text x="60" y="417" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Missing evidence: synchronized workload, device latency and mount options</text><text x="60" y="444" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5e7387">No established causal link between these observations.</text><text x="40" y="502" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Historical point observations · no reconstructed time series</text></svg>
