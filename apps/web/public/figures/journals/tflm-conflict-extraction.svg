<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740" role="img" aria-labelledby="title desc">
<title id="title">From operator access order to Conflict Data</title><desc id="desc">A manually prepared constraint in 2024 · not an implemented automatic compiler pass</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1727"/><stop offset="1" stop-color="#15253b"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2ac5b1"/><stop offset="1" stop-color="#68dcca"/></linearGradient></defs>
<rect x="0" y="0" width="1320" height="740" rx="22" fill="url(#bg)" stroke="#35516a" stroke-width="2"/>
<text x="58" y="70" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="34" font-weight="750" fill="#f4f9ff" >From operator access order to Conflict Data</text><text x="59" y="105" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="19" font-weight="450" fill="#aabdcf" >A manually prepared constraint in 2024 · not an implemented automatic compiler pass</text><path d="M58 138L1262 138" stroke="#4c6075" stroke-width="2"/><rect x="58" y="177" width="580" height="154" rx="17" fill="#172e42" stroke="#477b90" stroke-width="2"/><text x="83" y="220" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="750" fill="#edf7ff" >1 · Tensor pair</text><text x="83" y="267" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="22" font-weight="660" fill="#a2eedf" >Input A / Output B</text><text x="83" y="298" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="17" font-weight="480" fill="#b1cce0" >Size, lifetime and consumers</text><rect x="668" y="177" width="580" height="154" rx="17" fill="#172e42" stroke="#477b90" stroke-width="2"/><text x="693" y="220" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="750" fill="#edf7ff" >2 · Last-read boundary</text><text x="693" y="267" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="22" font-weight="660" fill="#a2eedf" >Read order vs write order</text><text x="693" y="298" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="17" font-weight="480" fill="#b1cce0" >Kernel, stride, shape and layout</text><rect x="58" y="374" width="580" height="154" rx="17" fill="#172e42" stroke="#c99a6c" stroke-width="2"/><text x="83" y="417" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="750" fill="#edf7ff" >3 · Legal offset range</text><text x="83" y="464" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="22" font-weight="660" fill="#ffce93" >Conflict[A,B] = [-L, K]</text><text x="83" y="495" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="17" font-weight="480" fill="#b1cce0" >Reject premature overwrites</text><rect x="668" y="374" width="580" height="154" rx="17" fill="#172e42" stroke="#477b90" stroke-width="2"/><text x="693" y="417" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="750" fill="#edf7ff" >4 · Static descriptor</text><text x="693" y="464" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="22" font-weight="660" fill="#a2eedf" >{ A, B, -L }</text><text x="693" y="495" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="17" font-weight="480" fill="#b1cce0" >Pass array and count to planner</text><rect x="58" y="603" width="1190" height="90" rx="16" fill="#203e4a" stroke="#4a9b91" /><text x="80" y="640" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="19" font-weight="650" fill="#d4f7ed" >Implemented in 2024: manual conflict arrays + C++ planner ordering / offset selection / TFLM integration</text><text x="80" y="671" font-family="Inter, 'Noto Sans KR', Arial, sans-serif" font-size="17" font-weight="470" fill="#afc7d7" >Future extension: automatic access profiling and baseline-vs-optimized correctness checks</text></svg>
