<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="668" viewBox="0 0 1120 668" role="img" aria-label="Separate state dimensions"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="666" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Separate state dimensions</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Illustrative states, not an observed mode map</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">State dimension</text><text x="395" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Examples</text><rect x="40" y="151" width="1040" height="62" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="190" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Volume robustness</text><text x="395" y="190" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Healthy / Degraded / Faulted</text><rect x="40" y="222" width="1040" height="62" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="261" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Attachment</text><text x="395" y="261" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Attached / Detached / Detaching</text><rect x="40" y="293" width="1040" height="62" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="332" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Process lifecycle</text><text x="395" y="332" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">Running / Stopping / Stopped</text><rect x="40" y="364" width="1040" height="62" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="403" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Engine replica mode</text><text x="395" y="403" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#253c51">RW / WO / ERR</text><text x="40" y="475" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Example: desired count = 2, active engine</text><rect x="40" y="495" width="500" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="290.0" y="524" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Replica A: RW</text><text x="290.0" y="549" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Usable read/write source</text><rect x="580" y="495" width="500" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="830.0" y="524" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Replica B: WO</text><text x="830.0" y="549" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Rebuild not yet complete</text><text x="40" y="620" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">An object count is not a count of current, usable copies.</text><text x="40" y="651" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual V1 model · not a historical volume inventory</text></svg>
