<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="Netfilter hooks follow the packet path"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="648" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Netfilter hooks follow the packet path</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Simplified routed IPv4 path; excludes bridge and XDP paths</text><rect x="40" y="115" width="500" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="290.0" y="157.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Incoming IPv4 packet</text><rect x="580" y="115" width="500" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="157.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Local process</text><rect x="40" y="232" width="500" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="290.0" y="261" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">PREROUTING</text><text x="290.0" y="286" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Conntrack, possible DNAT</text><path d="M290 185V232" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="232" width="500" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="830.0" y="261" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">OUTPUT</text><text x="830.0" y="286" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Local filtering / possible DNAT</text><path d="M830 185V232" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="355" width="500" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="290.0" y="384" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Route decision</text><text x="290.0" y="409" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">After destination translation</text><path d="M290 310V355" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="355" width="500" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="384" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Route reconsideration</text><text x="830.0" y="409" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">If destination changes</text><path d="M830 310V355" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="482" width="240" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="160.0" y="511" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">INPUT</text><text x="160.0" y="536" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Local destination</text><rect x="320" y="482" width="220" height="75" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="430.0" y="511" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">FORWARD</text><text x="430.0" y="536" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Transit filtering</text><path d="M290 430V455H160V482" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M290 455H430V482" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="482" width="500" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="830.0" y="511" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">POSTROUTING</text><text x="830.0" y="536" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Possible source NAT</text><path d="M830 430V482" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M540 519H580" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="600" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Local delivery and forwarded traffic do not traverse the same hooks.</text><text x="40" y="633" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not an incident packet capture</text></svg>
