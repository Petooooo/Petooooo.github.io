<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Compaction can temporarily increase disk usage"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="618" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Compaction can temporarily increase disk usage</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual coexistence, not a measured timeline</text><text x="40" y="142" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Before compaction</text><text x="40" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#5e7387">Source A + Source B</text><rect x="450" y="115" width="195" height="68" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="547.5" y="156.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source A</text><rect x="660" y="115" width="195" height="68" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="757.5" y="156.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source B</text><text x="40" y="284" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">During compaction</text><text x="40" y="311" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#5e7387">Sources remain + output grows</text><rect x="450" y="257" width="195" height="68" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="547.5" y="298.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source A</text><rect x="660" y="257" width="195" height="68" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="757.5" y="298.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source B</text><rect x="870" y="257" width="195" height="68" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="967.5" y="298.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">New block</text><text x="40" y="426" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">After successful commit</text><text x="40" y="453" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#5e7387">New block; old sources retired</text><rect x="870" y="399" width="195" height="68" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="967.5" y="440.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">New block</text><text x="40" y="568" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Peak space includes overlapping input and output; WAL has its own lifecycle.</text><text x="40" y="603" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Teaching model · not historical measurements</text></svg>
