<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="554" viewBox="0 0 1120 554" role="img" aria-label="August observations: victim versus consumer"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="552" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">August observations: victim versus consumer</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Sanitized records; page conversion is conditional</text><rect x="40" y="116" width="500" height="80" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="290.0" y="145" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Host graph</text><text x="290.0" y="170" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Roughly one fifth → near saturation</text><rect x="580" y="116" width="500" height="80" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="830.0" y="145" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Selected Pod charts</text><text x="830.0" y="170" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">No corresponding jump observed</text><rect x="40" y="236" width="500" height="220" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="270" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">earlyoom selection</text><text x="60" y="323" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="39" font-weight="750" text-anchor="start" fill="#253c51">≈ 608 MiB</text><text x="60" y="354" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Reported VmRSS</text><text x="60" y="389" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Victim size ≠ total spike</text><rect x="580" y="236" width="500" height="220" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="600" y="270" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">Later OOM task dump</text><text x="600" y="323" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" fill="#253c51">54,101,261 pages</text><text x="600" y="354" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">≈ 206.4 GiB if page size = 4 KiB</text><text x="600" y="389" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Large resident-memory candidate</text><text x="40" y="506" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">No confirmed time alignment, exclusive ownership or initiating allocation path.</text><text x="40" y="537" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Historical observations · not a common time-series sample</text></svg>
