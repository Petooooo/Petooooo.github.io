<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-label="Evidence matrix for CoreDNS Service IP failures and independently investigated MetalLB VIP reachability">
  <rect width="1320" height="780" rx="22" fill="#0b1422"/>
  <text x="48" y="61" fill="#eef8ff" font-size="32" font-weight="720" font-family="Inter,Arial,sans-serif">CoreDNS, ClusterIP and VIP: evidence map</text>
  <text x="48" y="100" fill="#abc4d5" font-size="18" font-family="Inter,Arial,sans-serif">What was observed, and which test would narrow the remaining cause</text>
  <path d="M48 123H1272" stroke="#38536a" stroke-width="1.5"/>
  <text x="48" y="158" fill="#91bed2" font-size="15" font-weight="700" letter-spacing="1.6" font-family="Inter,Arial,sans-serif">OBSERVATIONS FROM THE INTERNAL SERVICE INVESTIGATION</text>
  <rect x="48" y="175" width="598" height="159" rx="14" fill="#192e40" stroke="#5f9bc5" stroke-width="1.5"/>
  <rect x="674" y="175" width="598" height="159" rx="14" fill="#193530" stroke="#5da88e" stroke-width="1.5"/>
  <text x="71" y="211" fill="#d0ebfc" font-size="17" font-weight="720" font-family="Inter,Arial,sans-serif">OBSERVED · REQUEST</text>
  <text x="696" y="211" fill="#d4f6e7" font-size="17" font-weight="720" font-family="Inter,Arial,sans-serif">OBSERVED · HOST STATE</text>
  <path d="M71 224H622 M696 224H1248" stroke="#466779" stroke-width="1.2"/>
  <text x="71" y="262" fill="#f3f9fe" font-size="23" font-weight="700" font-family="Inter,Arial,sans-serif">Some Pod DNS / Service-IP access failed</text>
  <text x="71" y="303" fill="#b5ccdc" font-size="17" font-family="Inter,Arial,sans-serif">Origin-dependent symptoms; no full trace</text>
  <text x="696" y="262" fill="#ecfaf3" font-size="23" font-weight="700" font-family="Inter,Arial,sans-serif">Flannel UP · routes / NAT rules present</text>
  <text x="696" y="303" fill="#b4d5c8" font-size="17" font-family="Inter,Arial,sans-serif">Configuration exists; packet path unproven</text>
  <text x="48" y="374" fill="#e2bf8d" font-size="15" font-weight="700" letter-spacing="1.6" font-family="Inter,Arial,sans-serif">UNRESOLVED · DISTINCT TESTS NEEDED</text>
  <rect x="48" y="390" width="388" height="205" rx="14" fill="#25313e" stroke="#9c8969" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="466" y="390" width="388" height="205" rx="14" fill="#25313e" stroke="#9c8969" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="884" y="390" width="388" height="205" rx="14" fill="#25313e" stroke="#9c8969" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="70" y="431" fill="#f6e6ca" font-size="22" font-weight="710" font-family="Inter,Arial,sans-serif">Resolver vs Service</text>
  <text x="488" y="431" fill="#f6e6ca" font-size="22" font-weight="710" font-family="Inter,Arial,sans-serif">Host packet path</text>
  <text x="906" y="431" fill="#f6e6ca" font-size="22" font-weight="710" font-family="Inter,Arial,sans-serif">External VIP reachability</text>
  <path d="M70 447H414 M488 447H832 M906 447H1250" stroke="#636c6c" stroke-width="1"/>
  <text x="70" y="486" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">Same Pod, same DNS query:</text>
  <text x="70" y="516" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">ClusterIP:53 vs Pod endpoint</text>
  <text x="70" y="566" fill="#c2b194" font-size="16" font-family="Inter,Arial,sans-serif">Paired replies not preserved</text>
  <text x="488" y="486" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">Proxy rules · filtering · conntrack</text>
  <text x="488" y="516" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">Matched packets and return path</text>
  <text x="488" y="566" fill="#c2b194" font-size="16" font-family="Inter,Arial,sans-serif">No confirmed root-cause counters</text>
  <text x="906" y="486" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">Client TCP + L2 / BGP state</text>
  <text x="906" y="516" fill="#e0d4be" font-size="18" font-family="Inter,Arial,sans-serif">Advertisement and Endpoint</text>
  <text x="906" y="566" fill="#c2b194" font-size="16" font-family="Inter,Arial,sans-serif">No synchronized failure trace</text>
  <text x="48" y="634" fill="#a8bed0" font-size="15" font-weight="700" letter-spacing="1.6" font-family="Inter,Arial,sans-serif">SEPARATE, BETTER-EVIDENCED INCIDENT</text>
  <rect x="48" y="649" width="1224" height="81" rx="14" fill="#182d3a" stroke="#5c8da4" stroke-width="1.3"/>
  <text x="70" y="686" fill="#ecf8ff" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">ServiceLB hostPort collision after LoadBalancer addition</text>
  <text x="70" y="713" fill="#a9c9d8" font-size="16" font-family="Inter,Arial,sans-serif">Reversed by Service change/removal; not proof of DNS or VIP advertisement failure</text>
  <text x="48" y="765" fill="#8ca6b9" font-size="14" font-family="Inter,Arial,sans-serif">Diagnostic evidence summary, not a timed incident reconstruction or an internal cluster layout</text>
  <text x="1272" y="765" fill="#7394a6" font-size="13" font-family="Inter,Arial,sans-serif" text-anchor="end">OBSERVED / TO VERIFY</text>
</svg>