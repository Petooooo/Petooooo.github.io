<text x="713" y="244" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="740" fill="#8ebed4">WORKLOAD SYMPTOM</text>
<text x="713" y="274" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="540" fill="#e1eff7">A scheduled Pod may still lack a usable mount</text>
