<text x="83" y="634" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b8d0dc">Engine process lifecycle</text>
<rect x="59" y="664" width="554" height="80" rx="10" fill="#374039" stroke="#c8d59b" stroke-width="1.5"/>
<rect x="59" y="664" width="10" height="80" rx="4" fill="#c8d59b" stroke="#c8d59b" stroke-width="1.5"/>
