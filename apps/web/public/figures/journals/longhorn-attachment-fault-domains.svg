<rect x="692" y="359" width="752" height="75" rx="10" fill="#172e40" stroke="#9cc4dd" stroke-width="1.6"/>
<text x="713" y="384" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="740" fill="#9cc4dd">MOUNT EVIDENCE</text>
<text x="713" y="414" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="540" fill="#e1eff7">globalmount: Device or resource busy</text>
<path d="M613 518H637V512H682" fill="none" stroke="#b4b8e1" stroke-width="2.6"  stroke-linecap="round"/>
<rect x="692" y="482" width="752" height="75" rx="10" fill="#172e40" stroke="#b4b8e1" stroke-width="1.6"/>
<text x="713" y="507" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="740" fill="#b4b8e1">VOLUME EVIDENCE</text>
<text x="713" y="537" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="540" fill="#e1eff7">Detaching / Faulted / NotReady</text>
<path d="M613 613H637V630H682" fill="none" stroke="#e0b2cd" stroke-width="2.6"  stroke-linecap="round"/>
<rect x="692" y="600" width="752" height="75" rx="10" fill="#172e40" stroke="#e0b2cd" stroke-width="1.6"/>
<text x="713" y="625" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="740" fill="#e0b2cd">PROCESS EVIDENCE</text>
<text x="713" y="655" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="540" fill="#e1eff7">state stopping rather than stopped</text>
<path d="M613 795H637V765H682" fill="none" stroke="#a8d5b1" stroke-width="2.6"  stroke-linecap="round"/>
<rect x="692" y="735" width="752" height="75" rx="10" fill="#172e40" stroke="#a8d5b1" stroke-width="1.6"/>
<text x="713" y="760" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="740" fill="#a8d5b1">HOST AND REPLICA</text>
<text x="713" y="790" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="540" fill="#e1eff7">Node Ready; .img present; replica may be Stopped</text>
<rect x="59" y="875" width="1385" height="80" rx="12" fill="#202f3b" stroke="#677b87" stroke-width="1.5"/>
<text x="84" y="911" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="740" fill="#edc4a6">RECOVERY STILL NEEDS PROOF</text>
<text x="84" y="940" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="530" fill="#e0eaf0">Attach + healthy replicas + application read/write + integrity checks are separate milestones.</text>
<text x="59" y="988" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" fill="#93afc1">Conceptual fault boundaries. Observations occurred at different times; no actual nodes, disks or volumes are depicted.</text>
</svg>
