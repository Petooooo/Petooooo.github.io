<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" role="img" aria-labelledby="t d"><title id="t">Where a failed Longhorn attach crosses ownership boundaries</title><desc id="d">Layered diagnostic cross-section with application filesystem, CSI kubelet, Kubernetes and Longhorn volume attachment, engine instance-manager, replica and disk. Separate observations are pinned to their relevant layers, not drawn as a single causal chain. Recovery of a node or a process is not proof of user data integrity.</desc>
<rect x="0" y="0" width="1520" height="1010" rx="0" fill="#081420" stroke="#081420" stroke-width="0"/>
<text x="50" y="69" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="37" font-weight="780" fill="#f3faff">Where an attach failure actually lives</text>
<text x="50" y="110" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#b1cbd9">The same unavailable PVC can involve multiple owners and different evidence.</text>
<path d="M50 131H1470" fill="none" stroke="#56788c" stroke-width="1.8"  stroke-linecap="round"/>
<text x="57" y="178" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="730" fill="#87b1c6">STORAGE PATH · OWNERSHIP CROSS-SECTION</text>
<text x="682" y="178" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="730" fill="#87b1c6">CLUES FROM DIFFERENT INCIDENTS</text>
<rect x="59" y="209" width="554" height="80" rx="10" fill="#1a3445" stroke="#7bbad4" stroke-width="1.5"/>
<rect x="59" y="209" width="10" height="80" rx="4" fill="#7bbad4" stroke="#7bbad4" stroke-width="1.5"/>
