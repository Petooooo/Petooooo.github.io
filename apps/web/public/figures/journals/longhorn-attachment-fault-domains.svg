<text x="83" y="270" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b8d0dc">A read/write request must succeed</text>
<rect x="59" y="300" width="554" height="80" rx="10" fill="#1b3446" stroke="#7bbad4" stroke-width="1.5"/>
<rect x="59" y="300" width="10" height="80" rx="4" fill="#7bbad4" stroke="#7bbad4" stroke-width="1.5"/>
<text x="83" y="333" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="710" fill="#f2f9fc">Filesystem / mount</text>
<text x="83" y="361" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b8d0dc">Mounted device and access semantics</text>
<rect x="59" y="391" width="554" height="80" rx="10" fill="#203a4b" stroke="#8fc5da" stroke-width="1.5"/>
<rect x="59" y="391" width="10" height="80" rx="4" fill="#8fc5da" stroke="#8fc5da" stroke-width="1.5"/>
<text x="83" y="424" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="710" fill="#f2f9fc">CSI / kubelet</text>
<text x="83" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b8d0dc">Stage, publish, unmount, globalmount</text>
<rect x="59" y="482" width="554" height="80" rx="10" fill="#253d4a" stroke="#b3c2dc" stroke-width="1.5"/>
<rect x="59" y="482" width="10" height="80" rx="4" fill="#b3c2dc" stroke="#b3c2dc" stroke-width="1.5"/>
<text x="83" y="515" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="710" fill="#f2f9fc">Attachment controllers</text>
<text x="83" y="543" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b8d0dc">Volume state and attachment tickets</text>
<rect x="59" y="573" width="554" height="80" rx="10" fill="#3a3446" stroke="#ddacd0" stroke-width="1.5"/>
