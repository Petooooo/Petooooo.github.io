<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img" aria-label="Why the backfill cutoff matters"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7892a7"/></marker></defs><rect x="1" y="1" width="1118" height="543" rx="13" fill="#fff" stroke="#c9d7e1" stroke-width="1.5"/><rect x="24" y="27" width="6" height="49" rx="2" fill="#28608d" stroke="#28608d" stroke-width="1.5"/><text x="44" y="51" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#26394b">Why the backfill cutoff matters</text><text x="44" y="82" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Logical time only; no actual timestamps, traffic volumes or cutover schedule</text><path d="M40 105H1080" fill="none" stroke="#dce5ed" stroke-width="2.4"/><text x="48" y="145" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#26394b">Illustrative coverage of old and new ingestion</text><path d="M480 175V464" fill="none" stroke="#a1b5c4" stroke-width="2.4" stroke-dasharray="7 5"/><text x="480" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#26394b">Dual write active</text><path d="M700 175V464" fill="none" stroke="#a1b5c4" stroke-width="2.4" stroke-dasharray="7 5"/><text x="700" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#26394b">Backfill cutoff</text><text x="48" y="229" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#26394b">Historical copy</text><rect x="235" y="203" width="465" height="42" rx="3" fill="#bed5e8" stroke="#a5becf" stroke-width="1.5"/><text x="467.5" y="231" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26394b">Data before cutoff</text><text x="48" y="298" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#26394b">New write path</text><rect x="480" y="272" width="565" height="42" rx="3" fill="#b8dccc" stroke="#9ebfac" stroke-width="1.5"/><text x="762.5" y="300" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26394b">Writes already reaching v4</text><rect x="480" y="343" width="220" height="50" rx="3" fill="#dceee6" stroke="#9ebfac" stroke-width="1.5"/><text x="590.0" y="373" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26394b">Overlap</text><text x="48" y="433" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#26394b">Unsafe ordering</text><rect x="235" y="407" width="245" height="41" rx="3" fill="#bed5e8" stroke="#a5becf" stroke-width="1.5"/><rect x="480" y="407" width="220" height="41" rx="3" fill="#f1ccc3" stroke="#c98d7c" stroke-width="1.5"/><rect x="700" y="407" width="345" height="41" rx="3" fill="#b8dccc" stroke="#9ebfac" stroke-width="1.5"/><text x="590.0" y="433" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#973f32">Possible gap</text><text x="480" y="470" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#26394b">Cutoff first</text><text x="700" y="470" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#26394b">New path later</text><text x="48" y="496" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#26394b">Coverage matters more than the calendar order of deployments.</text><path d="M40 507H1080" fill="none" stroke="#dce5ed" stroke-width="2.4"/><text x="44" y="532" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#61758b">Conceptual explanation of public migration semantics</text></svg>
