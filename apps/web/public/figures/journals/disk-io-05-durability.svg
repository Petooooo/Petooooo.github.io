<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="622" viewBox="0 0 1120 622" role="img" aria-label="File and directory durability boundaries"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="620" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">File and directory durability boundaries</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Executed 4096-byte replacement in a temporary directory</text><text x="40" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Same-directory replacement</text><text x="665" y="130" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Verified observation</text><rect x="40" y="150" width="560" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="320.0" y="179" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Write temporary file</text><text x="320.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">4096 bytes accepted</text><path d="M600 187H645" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="150" width="435" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="862.5" y="194.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Pre-sync read matches</text><path d="M320 225V242" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="242" width="560" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="320.0" y="271" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">fsync(file)</text><text x="320.0" y="296" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Synchronize staged contents</text><path d="M600 279H645" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="242" width="435" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="862.5" y="286.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Call returned successfully</text><path d="M320 317V334" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="334" width="560" height="75" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="320.0" y="363" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">rename over target</text><text x="320.0" y="388" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Publish replacement name</text><path d="M600 371H645" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="334" width="435" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="862.5" y="378.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Old FD still reads old bytes</text><path d="M320 409V426" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="426" width="560" height="75" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="320.0" y="455" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">fsync(directory)</text><text x="320.0" y="480" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Synchronize name change</text><path d="M600 463H645" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="426" width="435" height="75" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="862.5" y="470.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">New target bytes match</text><text x="40" y="574" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Readback is visibility evidence, not a simulated power-loss result.</text><text x="40" y="605" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Actual syscall checks · no crash test or latency benchmark</text></svg>
