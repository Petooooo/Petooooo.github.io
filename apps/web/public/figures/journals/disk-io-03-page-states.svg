<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="586" viewBox="0 0 1120 586" role="img" aria-label="Dirty page and writeback lifecycle"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="584" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Dirty page and writeback lifecycle</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Simplified success paths with a redirty transition</text><rect x="40" y="150" width="300" height="82" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="190.0" y="179" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Clean cached page</text><text x="190.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Matches written contents</text><rect x="410" y="150" width="300" height="82" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="179" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Dirty page</text><text x="560.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Modified contents</text><rect x="780" y="150" width="300" height="82" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="930.0" y="179" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Writeback in flight</text><text x="930.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">I/O outstanding</text><path d="M340 191H410" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M710 191H780" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="375" y="137" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#253c51">Write</text><text x="745" y="137" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#253c51">Submit</text><rect x="780" y="340" width="300" height="82" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="930.0" y="369" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Redirtied</text><text x="930.0" y="394" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">New change during I/O</text><path d="M930 232V340" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="946" y="286" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#253c51">New write</text><path d="M780 381H560V232" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="580" y="368" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#253c51">More writeback needed</text><path d="M930 150V111H190V150" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="560" y="105" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#253c51">Completion without newer modification</text><rect x="40" y="470" width="1040" height="67" rx="7" fill="#f2f6fa" stroke="#c4d3df"/><text x="60" y="510" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Dirty and writeback flags can coexist; an I/O error needs separate handling.</text><text x="40" y="569" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a historical I/O trace</text></svg>
