<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" role="img" aria-labelledby="route-title route-desc"><title id="route-title">One public origin, different Plane service routes</title><desc id="route-desc">Conceptual route ownership matrix. Each request path has a separate target, including admin, API, web, live, spaces and object storage. A catch-all web route must not shadow more specific services.</desc>
