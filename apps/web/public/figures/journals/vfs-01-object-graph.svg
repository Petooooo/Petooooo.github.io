<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="727" viewBox="0 0 1120 727" role="img" aria-label="VFS objects and open-file references"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="725" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">VFS objects and open-file references</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual object graph with offsets from the disposable-file test</text><rect x="40" y="115" width="300" height="72" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="190.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Descriptor A</text><text x="190.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Original open</text><rect x="410" y="115" width="300" height="72" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="560.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Descriptor B</text><text x="560.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">dup(A)</text><rect x="780" y="115" width="300" height="72" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="930.0" y="144" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Descriptor C</text><text x="930.0" y="169" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Independent open</text><rect x="170" y="245" width="410" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="375.0" y="274" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">File description 1</text><text x="375.0" y="299" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Shared offset = 4</text><rect x="720" y="245" width="360" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="900.0" y="274" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">File description 2</text><text x="900.0" y="299" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Independent offset = 2</text><path d="M190 187V214H375V245" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M560 187V214H375" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M930 187V245" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="380" width="1040" height="125" rx="7" fill="#f2f6fa" stroke="#b9cbd9"/><text x="60" y="408" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Equivalent paths: mount + dentry</text><rect x="75" y="423" width="400" height="61" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="275.0" y="460.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Mount object</text><rect x="645" y="423" width="400" height="61" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="460.5" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Dentry</text><path d="M375 323V350H560V380" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M900 323V350H560" fill="none" stroke="#7793a8" stroke-width="2"/><rect x="75" y="568" width="400" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="275.0" y="597" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Superblock</text><text x="275.0" y="622" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Filesystem instance</text><rect x="645" y="568" width="400" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="845.0" y="597" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Inode</text><text x="845.0" y="622" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Same file object on filesystem</text><path d="M275 484V568" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M845 484V568" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M645 603H475" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="680" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">A file description retains a path; a descriptor is not a pathname.</text><text x="40" y="710" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a historical mount inventory</text></svg>
