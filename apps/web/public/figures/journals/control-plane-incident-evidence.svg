<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-label="K3s control-plane evidence matrix separating observed etcd and disk symptoms, partial recovery and unproven causal links">
  <rect width="1320" height="780" rx="22" fill="#0b1422"/>
  <text x="48" y="64" fill="#eff8ff" font-size="31" font-weight="730" font-family="Inter,Arial,sans-serif">K3s control-plane incidents: evidence boundaries</text>
  <text x="48" y="102" fill="#b5c9d9" font-size="18" font-family="Inter,Arial,sans-serif">Observed conditions, recovered access and causes not yet established</text>
  <path d="M48 125H1272" stroke="#38536b" stroke-width="1.5"/>
  <text x="48" y="160" fill="#8dbdd0" font-size="15" font-weight="720" letter-spacing="1.6" font-family="Inter,Arial,sans-serif">OBSERVED IN OPERATIONAL RECORDS</text>
  <rect x="48" y="179" width="598" height="156" rx="14" fill="#203348" stroke="#6b9cbd" stroke-width="1.5"/>
  <rect x="674" y="179" width="598" height="156" rx="14" fill="#332d38" stroke="#b89a7c" stroke-width="1.5"/>
  <text x="71" y="218" fill="#d3ebfc" font-size="17" font-weight="740" font-family="Inter,Arial,sans-serif">CONTROL PLANE / etcd</text>
  <text x="697" y="218" fill="#f4dfc6" font-size="17" font-weight="740" font-family="Inter,Arial,sans-serif">HOST / DISK SYMPTOMS</text>
  <path d="M71 230H621 M697 230H1247" stroke="#4a6177" stroke-width="1.2"/>
  <text x="71" y="267" fill="#f1f8fe" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">etcd unstable / corruption suspected</text>
  <text x="71" y="307" fill="#b9cfde" font-size="17" font-family="Inter,Arial,sans-serif">API availability problems investigated</text>
  <text x="697" y="267" fill="#fdf5e9" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">Read-only behavior reported</text>
  <text x="697" y="307" fill="#d4c3ae" font-size="17" font-family="Inter,Arial,sans-serif">Filesystem cause not confirmed</text>
  <text x="48" y="377" fill="#e0bd88" font-size="15" font-weight="710" letter-spacing="1.5" font-family="Inter,Arial,sans-serif">POSSIBLE LINKS · NOT VERIFIED AS AN INCIDENT TIMELINE</text>
  <rect x="48" y="394" width="387" height="173" rx="14" fill="#28313b" stroke="#a18e70" stroke-width="1.4" stroke-dasharray="6 5"/>
  <rect x="466" y="394" width="387" height="173" rx="14" fill="#28313b" stroke="#a18e70" stroke-width="1.4" stroke-dasharray="6 5"/>
  <rect x="884" y="394" width="388" height="173" rx="14" fill="#28313b" stroke="#a18e70" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="69" y="433" fill="#f4e9d5" font-size="21" font-weight="710" font-family="Inter,Arial,sans-serif">Host I/O → etcd</text>
  <text x="487" y="433" fill="#f4e9d5" font-size="21" font-weight="710" font-family="Inter,Arial,sans-serif">etcd quorum → API</text>
  <text x="905" y="433" fill="#f4e9d5" font-size="21" font-weight="710" font-family="Inter,Arial,sans-serif">API → workloads</text>
  <path d="M69 450H412 M487 450H830 M905 450H1249" stroke="#77746b" stroke-width="1"/>
  <text x="69" y="487" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">Match mount and kernel errors</text>
  <text x="69" y="515" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">with member write failures</text>
  <text x="487" y="487" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">Match member / quorum state</text>
  <text x="487" y="515" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">with failing API operations</text>
  <text x="905" y="487" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">Verify reconciliation, volume</text>
  <text x="905" y="515" fill="#dfd2bd" font-size="17" font-family="Inter,Arial,sans-serif">and application read / write</text>
  <text x="69" y="546" fill="#c2b094" font-size="15" font-family="Inter,Arial,sans-serif">No synchronized evidence</text>
  <text x="487" y="546" fill="#c2b094" font-size="15" font-family="Inter,Arial,sans-serif">No full member trace</text>
  <text x="905" y="546" fill="#c2b094" font-size="15" font-family="Inter,Arial,sans-serif">No whole-system audit</text>
  <text x="48" y="612" fill="#92c9b8" font-size="15" font-weight="720" letter-spacing="1.6" font-family="Inter,Arial,sans-serif">RECOVERY CHECKPOINTS · LIMITED CLAIMS</text>
  <rect x="48" y="629" width="1224" height="99" rx="14" fill="#1b3734" stroke="#63a48e" stroke-width="1.4"/>
  <path d="M658 645V710" stroke="#47766c" stroke-width="1.5"/>
  <text x="71" y="668" fill="#e4faf1" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Some services became available again</text>
  <text x="71" y="702" fill="#b0d8c8" font-size="16" font-family="Inter,Arial,sans-serif">Does not identify the initiating fault</text>
  <text x="682" y="668" fill="#e4faf1" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Separate node returned to Ready</text>
  <text x="682" y="702" fill="#b0d8c8" font-size="16" font-family="Inter,Arial,sans-serif">Longhorn replica recovery not established</text>
  <text x="48" y="762" fill="#8ca8b8" font-size="14" font-family="Inter,Arial,sans-serif">Conceptual evidence matrix, not a dated timeline, private node topology or recovery runbook</text>
  <text x="1272" y="762" fill="#7597a8" font-size="13" font-family="Inter,Arial,sans-serif" text-anchor="end">OBSERVED / UNVERIFIED</text>
</svg>