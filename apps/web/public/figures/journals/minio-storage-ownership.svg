#b9e6d6">Failure tolerance depends on erasure quorum</text><text x="1103" y="732" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#9ec6cb">and the actual failure domains</text><path d="M48 812L1432 812" fill="none" stroke="#385568" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="49" y="844" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#a9c2d0">Conceptual models only. Copy/shard counts and storage-member placements are illustrative, not the actual infrastructure.</text></svg>