<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 875" role="img" aria-labelledby="m-title m-desc"><title id="m-title">Where does object-storage redundancy live?</title><desc id="m-desc">Replicated block storage and erasure-coded object storage have different owners</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#83c9d5" stroke-width="1.7"/></marker></defs><rect width="1480" height="875" rx="20" fill="#091521"/><text x="48" y="58" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="750" fill="#f2f8fd">Where does object-storage redundancy live?</text><text x="48" y="95" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#aac6d7">Replicated block storage and erasure-coded object storage have different owners</text><path d="M48 119L1432 119" fill="none" stroke="#385568" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><rect x="44" y="158" width="668" height="603" rx="18" fill="#0e2638" stroke="#30556c" stroke-width="1.5"/><rect x="770" y="158" width="668" height="603" rx="18" fill="#0e2638" stroke="#30556c" stroke-width="1.5"/><text x="74" y="203" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" fill="#8bd6e7">BLOCK LAYER OWNS REDUNDANCY</text><text x="74" y="235" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b5d1df">One object server; replicated underlying volume</text><text x="800" y="203" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" fill="#9ae3c9">OBJECT LAYER OWNS REDUNDANCY</text><text x="800" y="235" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" fill="#b5d1df">A distributed object service; encoded shards</text><rect x="19