<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-label="A filesystem can have several mount views"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="658" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">A filesystem can have several mount views</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Illustrative namespaces and paths; no actual host mounts created</text><rect x="40" y="115" width="490" height="310" rx="7" fill="#f2f6fa" stroke="#bacddb"/><text x="60" y="149" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">Host mount namespace</text><rect x="70" y="175" width="430" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="285.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Host root tree</text><text x="285.0" y="229" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">/</text><rect x="70" y="310" width="430" height="80" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="285.0" y="339" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Attachment H</text><text x="285.0" y="364" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">/stage</text><path d="M285 245V310" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="115" width="490" height="310" rx="7" fill="#f2f6fa" stroke="#bacddb"/><text x="610" y="149" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#253c51">Workload mount namespace</text><rect x="620" y="175" width="430" height="70" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="835.0" y="204" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Container root tree</text><text x="835.0" y="229" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">/</text><rect x="620" y="310" width="430" height="80" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="835.0" y="339" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Attachment W</text><text x="835.0" y="364" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">/data</text><path d="M835 245V310" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="487" width="520" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="560.0" y="516" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Shared filesystem subtree</text><text x="560.0" y="541" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Same data; distinct attachment identities</text><path d="M285 390V455H430V487" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M835 390V455H690V487" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="610" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Propagation controls mount events, not ordinary file writes.</text><text x="40" y="643" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Explanatory model · not a historical mount inventory</text></svg>
