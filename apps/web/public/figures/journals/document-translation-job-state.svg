<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Document translation: stage claims and retries</title><desc id="desc">Durable stage ownership, acknowledgements and bounded retry</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#6cbecc" stroke-width="1.6"/></marker></defs><rect width="1440" height="900" rx="19" fill="#091521"/><text x="41" y="55" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="750" text-anchor="start" fill="#eff7fd">Document translation: stage claims and retries</text><text x="42" y="93" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#abc4d4">Durable stage ownership, acknowledgements and bounded retry</text><path d="M42 118L1398 118" fill="none" stroke="#345365" stroke-width="1" stroke-linecap="round" /><rect x="52" y="160" width="1336" height="595" rx="15" fill="#0f2435" stroke="#36576b" stroke-width="1.6"/><text x="79" y="199" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="720" text-anchor="start" fill="#a6d4ea">DURABLE STAGE STATE</text><rect x="85" y="349" width="236" height="90" rx="14" fill="#26425b" stroke="#709bb6" stroke-width="1.6"/><text x="203" y="384" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#e6f4fc">Pending</text><text x="203" y="413" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#b8cfdf">no active claim</text><rect x="411" y="234" width="240" height="105" rx="14" fill="#1f5552" stroke="#73ccb0" stroke-width="1.6"/><text x="531" y="274" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#f0fff7">Claimed</text><text x="531" y="305" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#b8e8d7">lease + attempt</text><rect x="748" y="234" width="240" height="105" rx="14" fill="#22566a" stroke="#72b1c7" stroke-width="1.6"/><text x="868" y="274" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#e4f8fd">Running</text><text x="868" y="305" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#b7dbe8">artifact work</text><rect x="1098" y="234" width="238" height="105" rx="14" fill="#23594b" stroke="#7bd3aa" stroke-width="1.6"/><text x="1217" y="275" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#e9fff4">Completed</text><text x="1217" y="307" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#bce8d4">result confirmed</text><rect x="746" y="535" width="240" height="103" rx="14" fill="#4d413e" stroke="#cea279" stroke-width="1.6"/><text x="866" y="576" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#fff2dd">Retry wait</text><text x="866" y="607" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#ecd1b3">backoff / stale lease</text><rect x="1098" y="535" width="238" height="103" rx="14" fill="#553947" stroke="#c37e94" stroke-width="1.6"/><text x="1217" y="575" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#ffe9ef">Failed</text><text x="1217" y="606" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#e8bdc8">terminal / inspect</text><path d="M324 373L406 293" fill="none" stroke="#75d4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="334" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#aadfcd">claim</text><path d="M654 286H743" fill="none" stroke="#79d8c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="704" y="220" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#aadfd8">broker ACK after claim</text><path d="M991 285H1093" fill="none" stroke="#71cbaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1044" y="220" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#a6debd">verify artifact</text><path d="M867 344V530" fill="none" stroke="#e5b680" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="885" y="452" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#eed0a7">timeout / failure</text><path d="M994 587H1094" fill="none" stroke="#ce93a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1042" y="524" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#ebc7d0">limit reached</text><path d="M744 584H690V449H204V443" fill="none" stroke="#d2ad83" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="491" y="472" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e7caa7">reconcile and retry same logical stage</text><path d="M1217 228V205H1292V230" fill="none" stroke="#88d6ac" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" /><text x="77" y="706" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#cfe2ed">Duplicate or stale completions: ignore unless the current stage and claim match.</text><text x="76" y="731" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="480" text-anchor="start" fill="#a9c7d7">Message ACK and completed artifact are not the same event.</text><path d="M42 835L1398 835" fill="none" stroke="#345365" stroke-width="1" stroke-linecap="round" /><text x="42" y="867" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#b1c7d4">Conceptual lifecycle; retries and terminal failure depend on the configured application policy.</text></svg>
