 readiness</text><text x="983.5" y="364" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b2c5d3" font-weight="450" >Service endpoint</text><text x="983.5" y="388" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b2c5d3" font-weight="450" >Functional read/write</text><text x="983.5" y="412" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b2c5d3" font-weight="450" >Observed RTO / RPO</text><text x="42" y="556" font-family="Inter,Arial,sans-serif" font-size="16" fill="#a7bdd1" font-weight="450" >Kubernetes reconciliation, storage repair and application correctness are different milestones.</text><text x="1238" y="556" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7294a8" font-weight="500" text-anchor="end">CONCEPTUAL · NOT A DEPLOYMENT TOPOLOGY</text></svg>