<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="Delivery can repeat without repeating the effect"><rect width="1280" height="590" rx="18" fill="#0b1220"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#88dbea" stroke-width="2"/></marker></defs><text x="42" y="57" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f2f9ff" font-weight="750" >Delivery can repeat without repeating the effect</text><text x="42" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#b0c4d1" font-weight="500" >The idempotency boundary is an application responsibility, not a broker guarantee</text><path d="M42 122H1238" stroke="#41556a"/><rect x="43" y="194" width="273.75" height="256" rx="14" fill="#1b2e41" stroke="#678eac" stroke-width="1.7"/><text x="62" y="239" font-family="Inter,Arial,sans-serif" font-size="21" fill="#f1f8fd" font-weight="650" >Producer</text><text x="62" y="297" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Logical work ID</text><text x="62" y="324" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Publish + confirm</text><text x="62" y="351" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Request accepted</text><path d="M319.75 322H341.75" stroke="#8adcea" stroke-width="2.5" marker-end="url(#arr)"/><rect x="349.75" y="194" width="273.75" height="256" rx="14" fill="#1b2e41" stroke="#678eac" stroke-width="1.7"/><text x="368.75" y="239" font-family="Inter,Arial,sans-serif" font-size="21" fill="#f1f8fd" font-weight="650" >RabbitMQ</text><text x="368.75" y="297" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Queue + delivery</text><text x="368.75" y="324" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Retry / redelivery</text><text x="368.75" y="351" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Broker ack state</text><path d="M626.5 322H648.5" stroke="#8adcea" stroke-width="2.5" marker-end="url(#arr)"/><rect x="656.5" y="194" width="273.75" height="256" rx="14" fill="#1b2e41" stroke="#678eac" stroke-width="1.7"/><text x="675.5" y="239" font-family="Inter,Arial,sans-serif" font-size="21" fill="#f1f8fd" font-weight="650" >Consumer</text><text x="675.5" y="297" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Check work state</text><text x="675.5" y="324" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Perform side effect</text><text x="675.5" y="351" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Handle crash window</text><path d="M933.25 322H955.25" stroke="#8adcea" stroke-width="2.5" marker-end="url(#arr)"/><rect x="963.25" y="194" width="273.75" height="256" rx="14" fill="#1b2e41" stroke="#74deb4" stroke-width="1.7"/><text x="982.25" y="239" font-family="Inter,Arial,sans-serif" font-size="21" fill="#f1f8fd" font-weight="650" >Durable result</text><text x="982.25" y="297" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Idempotency record</text><text x="982.25" y="324" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Completed / failed</text><text x="982.25" y="351" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bbcedb" font-weight="500" >Acknowledge safely</text><text x="42" y="547" font-family="Inter,Arial,sans-serif" font-size="16" fill="#aac2d2" font-weight="500" >A worker may commit an effect and crash before ack; a redelivery must not duplicate the effect.</text><text x="1238" y="547" font-family="Inter,Arial,sans-serif" font-size="13" fill="#768fa3" font-weight="500" text-anchor="end">CONCEPTUAL / OBSERVATION</text></svg>