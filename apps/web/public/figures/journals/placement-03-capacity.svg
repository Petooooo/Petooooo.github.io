<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="609" viewBox="0 0 1120 609" role="img" aria-label="Stored-copy cost versus write amplification"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="607" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Stored-copy cost versus write amplification</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">100 GiB baseline; metadata, snapshots and temporary space excluded</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Illustrative stored payload (GiB)</text><text x="40" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">One copy</text><rect x="390" y="165" width="147.5" height="46" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="552.5" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#253c51">100</text><text x="40" y="278" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Two database copies</text><rect x="390" y="249" width="295.0" height="46" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="700.0" y="278" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#253c51">200</text><text x="40" y="362" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Two DB × two block copies</text><rect x="390" y="333" width="590.0" height="46" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="995.0" y="362" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#253c51">400</text><text x="40" y="446" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">4+2 coded shards</text><rect x="390" y="417" width="221.25" height="46" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="626.25" y="446" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#253c51">150</text><text x="40" y="530" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">Payload factors: 1× / 2× / 4× / 1.5×</text><text x="40" y="559" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#5e7387">Different protection contracts; not measured write amplification.</text><text x="40" y="592" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Teaching model · not historical topology or measurements</text></svg>
