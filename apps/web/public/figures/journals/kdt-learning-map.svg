<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="From a C++ program down to the Linux kernel"><rect width="1280" height="590" rx="20" fill="#0b1220"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#81d8e9" stroke-width="2"/></marker></defs><text x="42" y="57" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f0f8ff" font-weight="750" >From a C++ program down to the Linux kernel</text><text x="42" y="95" font-family="Inter,Arial,sans-serif" font-size="17" fill="#acbdcb" font-weight="500" >The KDT curriculum connected the layers rather than teaching isolated tools</text><path d="M42 121H1238" stroke="#32475a"/><rect x="43" y="190" width="214.8" height="292" rx="14" fill="#1b2b40" stroke="#4c829a" stroke-width="1.7"/><text x="60" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >01</text><text x="60" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >C++ / build</text><text x="60" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Pointers + memory</text><text x="60" y="384" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Make / GDB</text><text x="60" y="410" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8ccd9" font-weight="500" >Data structures</text><path d="M261.8 329H280.8" stroke="#7cceed" stroke-width="2.5" marker-end="url(#arr)"/><rect x="287.8" y="190" width="214.8" height="292" rx="14" fill="#1b3039" stroke="#4c829a" stroke-width="1.7"/><text x="304.8" y="232" font-family="Inter,Arial,sans-serif" font-size="22" fill="#75ccdf" font-weight="750" >02</text><text x="304.8" y="282" font-family="Inter,Arial,sans-serif" font-size="20" fill="#f1f9fd" font-weight="650" >POSIX</text><text x="304.8" y="358" font-family="Inter,Arial,sans-serif" font-size="15" fill="