<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-label="A migration has multiple independent truth sources"><rect width="1280" height="590" rx="20" fill="#0b1220"/><path d="M42 123H1238" stroke="#35506a" stroke-width="1"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#72d5ec" stroke-width="1.8"/></marker></defs><text x="42" y="57" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f5faff" font-weight="750" >A migration has multiple independent truth sources</text><text x="42" y="93" font-family="Inter,Arial,sans-serif" font-size="17" fill="#a9becf" font-weight="400" >Langfuse migration · a request timeout is not the same as a failed rewrite</text><rect x="43" y="184" width="276" height="292" rx="15" fill="#192b42" stroke="#76c9e4" stroke-width="1.7"/><text x="65" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Worker response</text><path d="M65 250H297" stroke="#496375"/><text x="65" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Timeout / error display</text><text x="65" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Caller may stop waiting</text><text x="65" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Not a data audit</text><rect x="349" y="184" width="276" height="292" rx="15" fill="#1a3039" stroke="#67ad9d" stroke-width="1.7"/><text x="371" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Persisted progress</text><path d="M371 250H603" stroke="#496375"/><text x="371" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >phase = completed</text><text x="371" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >9 chunks completed</text><text x="371" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >0 chunks failed</text><rect x="655" y="184" width="276" height="292" rx="15" fill="#1a3039" stroke="#67ad9d" stroke-width="1.7"/><text x="677" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Stateful dependencies</text><path d="M677 250H909" stroke="#496375"/><text x="677" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >ClickHouse / Keeper</text><text x="677" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Replica read-only state</text><text x="677" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Destination free space</text><rect x="961" y="184" width="276" height="292" rx="15" fill="#1a3039" stroke="#67ad9d" stroke-width="1.7"/><text x="983" y="230" font-family="Inter,Arial,sans-serif" font-size="22" fill="#eef8fc" font-weight="700" >Functional proof</text><path d="M983 250H1215" stroke="#496375"/><text x="983" y="293" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >Historical reads</text><text x="983" y="325" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >New writes / jobs</text><text x="983" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b6ccd9" font-weight="500" >End-to-end checks</text><text x="42" y="556" font-family="Inter,Arial,sans-serif" font-size="16" fill="#a7bdd1" font-weight="450" >The recorded progress and the application-visible result must be reconciled.</text><text x="1238" y="556" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7294a8" font-weight="500" text-anchor="end">CONCEPTUAL · NOT A DEPLOYMENT TOPOLOGY</text></svg>