<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-label="Why the MA writeback signals existed"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L9 4L1 7z" fill="#0c6184"/></marker></defs><rect x="0" y="0" width="1280" height="750" rx="18" fill="#fff" stroke="#bed0da" stroke-width="2"/><rect x="0" y="0" width="1280" height="113" rx="18" fill="#f5f9fc" stroke="#f5f9fc" stroke-width="1"/><rect x="36" y="35" width="6" height="47" rx="2" fill="#0e6384" stroke="#0e6384" stroke-width="1"/><text x="58" y="61" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="32" font-weight="760">Why the MA writeback signals existed</text><text x="59" y="93" text-anchor="start" fill="#587184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="510">Report page 8 · synchronous register-file timing and the MA interface</text><path d="M40 124H1240" stroke="#cfdae3" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="57" y="183" width="1164" height="438" rx="12" fill="#f8fbfd" stroke="#c4d0d9" stroke-width="1.5"/><text x="75" y="214" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="750">The WB boundary depends on the Register File clock</text><rect x="94" y="312" width="291" height="148" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="239.5" y="347" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">MEM outputs</text><text x="239.5" y="373" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">ALU_OUT_MEM / MOUT_M</text><rect x="479" y="298" width="286" height="175" rx="9" fill="#f4f9fc" stroke="#1977a0" stroke-width="2"/><text x="622.0" y="333" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">MA signals</text><text x="622.0" y="359" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">dest_MA / WEN_MA / op_MA</text><rect x="879" y="314" width="258" height="147" rx="9" fill="#f4f9fc" stroke="#8a66af" stroke-width="2"/><text x="1008.0" y="349" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">Register File</text><text x="1008.0" y="375" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">synchronous write</text><path d="M385 384L465 384" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M765 384L865 384" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="93" y="523" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="630">ALU_OUT_MA &lt;= ALU_OUT_MEM</text><text x="93" y="554" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="630">MOUT_MA &lt;= MOUT_M</text><text x="93" y="591" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="520">Documented to avoid the extra WB pipe register delaying visible writes</text><path d="M40 694H1240" stroke="#c4d4df" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="47" y="726" text-anchor="start" fill="#6d8593" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="480">Vector redraw of the source report · not a hardware trace</text></svg>
