<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="An unlinked file can remain open"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="598" rx="7" fill="#ffffff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">An unlinked file can remain open</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Actual six-byte test: ABCDEF, dup, independent open, link and unlink</text><text x="40" y="128" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Read operation</text><text x="460" y="128" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Returned bytes</text><text x="755" y="128" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Position after read</text><rect x="40" y="150" width="1040" height="50" rx="5" fill="#e3edf6" stroke="#c1d0dc"/><text x="56" y="182" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Original: read(2)</text><text x="460" y="182" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">AB</text><text x="755" y="182" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">2</text><rect x="40" y="208" width="1040" height="50" rx="5" fill="#e3edf6" stroke="#c1d0dc"/><text x="56" y="240" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Duplicate: read(2)</text><text x="460" y="240" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">CD</text><text x="755" y="240" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">4</text><rect x="40" y="266" width="1040" height="50" rx="5" fill="#e0eee4" stroke="#c1d0dc"/><text x="56" y="298" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#253c51">Independent: read(2)</text><text x="460" y="298" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">AB</text><text x="755" y="298" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">2</text><text x="40" y="360" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#253c51">Name lifetime and open references</text><rect x="40" y="384" width="245" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="162.5" y="413" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Two names</text><text x="162.5" y="438" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">nlink = 2</text><path d="M285 423H305" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="305" y="384" width="245" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="427.5" y="413" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">First unlink</text><text x="427.5" y="438" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">nlink = 1</text><path d="M550 423H570" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="384" width="245" height="78" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="692.5" y="413" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Last unlink</text><text x="692.5" y="438" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">nlink = 0</text><path d="M815 423H835" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="835" y="384" width="245" height="78" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="957.5" y="413" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Open FD remains</text><text x="957.5" y="438" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Read EF after close(A)</text><rect x="40" y="495" width="1040" height="56" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="530" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">New opens of both names fail with ENOENT; fstat on the duplicate still works.</text><text x="40" y="583" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Verified with ordinary Linux file calls · no disk-space benchmark</text></svg>
