chor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">64-bit concatenation</text><rect x="779" y="299" width="189" height="120" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="873.5" y="334" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">&gt;&gt; shamt</text><text x="873.5" y="360" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">or valC[4:0]</text><rect x="1039" y="302" width="137" height="112" rx="9" fill="#f4f9fc" stroke="#1f7396" stroke-width="2"/><text x="1107.5" y="337" text-anchor="middle" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="740">[31:0]</text><text x="1107.5" y="363" text-anchor="middle" fill="#527085" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="510">ROR output</text><path d="M312 360L380 360" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M684 360L766 360" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M968 360L1027 360" stroke="#0c6184" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="88" y="529" text-anchor="start" fill="#203346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="590">The operation wraps shifted-out bits by selecting the lower 32 bits afterward</text><path d="M40 694H1240" stroke="#c4d4df" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="47" y="726" text-anchor="start" fill="#6d8593" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="480">Vector redraw of the source report · not a hardware trace</text></svg>
