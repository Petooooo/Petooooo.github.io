<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="585" viewBox="0 0 1120 585" role="img" aria-label="A pathname can lead to a different object"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="583" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">A pathname can lead to a different object</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Actual temporary-directory experiment · no bind mounts created</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Step</text><text x="385" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">New lookup via alias</text><text x="770" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Original open FD</text><rect x="40" y="155" width="1040" height="78" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><rect x="367" y="160" width="370" height="68" rx="4" fill="#e0eee4" stroke="#c4d3df"/><text x="55" y="201" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">1. Link to data</text><text x="385" y="201" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Reads original</text><text x="770" y="201" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Original inode</text><rect x="40" y="247" width="1040" height="78" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><rect x="367" y="252" width="370" height="68" rx="4" fill="#f6dfda" stroke="#c4d3df"/><text x="55" y="293" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">2. Rename target</text><text x="385" y="293" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">ENOENT (dangling)</text><text x="770" y="293" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Original inode retained</text><rect x="40" y="339" width="1040" height="78" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><rect x="367" y="344" width="370" height="68" rx="4" fill="#f4e8ce" stroke="#c4d3df"/><text x="55" y="385" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#253c51">3. Recreate target</text><text x="385" y="385" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Reads replacement</text><text x="770" y="385" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Still reads original</text><rect x="40" y="457" width="1040" height="79" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="560.0" y="486" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Hard link check: same inode, link count = 2</text><text x="560.0" y="511" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Symbolic link lookup and open file identity are different</text><text x="40" y="568" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">All identity and byte-read checks passed</text></svg>
