<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="611" viewBox="0 0 1120 611" role="img" aria-label="Migration success has several evidence boundaries"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7892a7"/></marker></defs><rect x="1" y="1" width="1118" height="609" rx="13" fill="#fff" stroke="#c9d7e1" stroke-width="1.5"/><rect x="24" y="27" width="6" height="49" rx="2" fill="#28608d" stroke="#28608d" stroke-width="1.5"/><text x="44" y="51" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#26394b">Migration success has several evidence boundaries</text><text x="44" y="82" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#61758b">Suggested validation matrix; not a record of every test performed</text><path d="M40 105H1080" fill="none" stroke="#dce5ed" stroke-width="2.4"/><text x="54" y="143" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26394b">Layer</text><text x="290" y="143" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26394b">Evidence to examine</text><text x="737" y="143" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26394b">Meaning</text><rect x="48" y="161" width="1024" height="54" rx="3" fill="#f0f5f9" stroke="#dbe4eb" stroke-width="1.5"/><text x="64" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Request</text><text x="290" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Timeout / success</text><text x="737" y="194" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#26394b">Response lifetime</text><rect x="48" y="223" width="1024" height="54" rx="3" fill="#fff" stroke="#dbe4eb" stroke-width="1.5"/><text x="64" y="256" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Durable job</text><text x="290" y="256" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Phase + chunk counters</text><text x="737" y="256" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#26394b">Recorded progress</text><rect x="48" y="285" width="1024" height="54" rx="3" fill="#f0f5f9" stroke="#dbe4eb" stroke-width="1.5"/><text x="64" y="318" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Data engine</text><text x="290" y="318" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Writable replicas + capacity</text><text x="737" y="318" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#26394b">Ability to write</text><rect x="48" y="347" width="1024" height="54" rx="3" fill="#fff" stroke="#dbe4eb" stroke-width="1.5"/><text x="64" y="380" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">Read model</text><text x="290" y="380" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">Historical hierarchy + fields</text><text x="737" y="380" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#26394b">Usability of sampled data</text><rect x="48" y="409" width="1024" height="54" rx="3" fill="#f0f5f9" stroke="#dbe4eb" stroke-width="1.5"/><text x="64" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">New ingestion</text><text x="290" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#26394b">New record → query</text><text x="737" y="442" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#26394b">End-to-end sampled path</text><rect x="48" y="493" width="1024" height="70" rx="8" fill="#e8f4ed" stroke="#a6c6b4" stroke-width="1.5"/><text x="68" y="522" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#26394b">None of these alone proves complete historical parity.</text><text x="68" y="547" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#26394b">Cleanup is a separate milestone after the applicable checks.</text><path d="M40 573H1080" fill="none" stroke="#dce5ed" stroke-width="2.4"/><text x="44" y="598" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#61758b">Conceptual explanation of public migration semantics</text></svg>
