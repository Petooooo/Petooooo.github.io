<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="730" viewBox="0 0 1320 730" role="img" aria-labelledby="title desc">
<title id="title">RISC TOY hazard decisions and stall states</title>
<desc id="desc">Case 1 forwards from MEM ALU, Case 2 forwards from WB ALU, Case 3 holds for one cycle before forwarding loaded memory data, and branch/jump control stalls ID for two cycles.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1526"/><stop offset="1" stop-color="#12223b"/></linearGradient>
 <marker id="arr" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7dd9ce"/></marker>
 <style>
 text{font-family:Inter,'Noto Sans KR','Segoe UI',sans-serif;fill:#deeaf6}
 .title{font-size:33px;font-weight:750;fill:#f4f8ff}
 .sub{font-size:18px;fill:#9fb6cb}
 .case{font-size:22px;font-weight:735;fill:#f2f6ff}
 .text{font-size:18px;fill:#cee1f2}
 .code{font-size:16px;font-weight:675;fill:#9cf3de}
 .dim{font-size:15px;fill:#9eb5ca}
 .foot{font-size:17px;fill:#b6cada}
 </style>
</defs>
<rect width="1320" height="730" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1318" height="728" rx="21" stroke="#344d67" stroke-width="2" fill="none"/>
<text class="title" x="56" y="68">Hazard handling in the original RTL</text>
<text class="sub" x="56" y="105">Not all dependencies can use the same forwarding source</text>
<path d="M56 132H1264" stroke="#32475d" stroke-width="2"/>
<!-- Case 1 -->
<rect x="55" y="153" width="1210" height="121" rx="16" fill="#162c40" stroke="#417f96" stroke-width="1.6"/>
<rect x="78" y="174" width="185" height="78" rx="12" fill="#1d4150"/>
<text class="case" x="96" y="202">CASE 1</text>
<text class="dim" x="96" y="228">Adjacent ALU</text>
<rect x="306" y="173" width="326" height="81" rx="11" fill="#21374c"/>
<text class="code" x="326" y="202">dest_MEM == source</text>
<text class="text" x="326" y="229">ALU_OUT_MEM</text>
<path d="M647 214H797" stroke="#7dd9ce" stroke-width="3.2" marker-end="url(#arr)"/>
<rect x="814" y="173" width="400" height="81" rx="11" fill="#1c3645"/>
<text class="case" x="836" y="204">EX uses the MEM ALU result</text>
<text class="dim" x="836" y="234">No register-file writeback wait</text>
<!-- Case 2 -->
<rect x="55" y="290" width="1210" height="121" rx="16" fill="#182b42" stroke="#8678b7" stroke-width="1.6"/>
<rect x="78" y="311" width="185" height="78" rx="12" fill="#322d53"/>
<text class="case" x="96" y="339">CASE 2</text>
<text class="dim" x="96" y="365">Separated ALU</text>
<rect x="306" y="310" width="326" height="81" rx="11" fill="#2b304d"/>
<text class="code" x="326" y="339">dest_WB == source</text>
<text class="text" x="326" y="366">ALU_OUT_WB</text>
<path d="M647 351H797" stroke="#b49cfa" stroke-width="3.2" marker-end="url(#arr)"/>
<rect x="814" y="310" width="400" height="81" rx="11" fill="#252d47"/>
<text class="case" x="836" y="341">EX uses the WB ALU result</text>
<text class="dim" x="836" y="371">Producer is one stage further</text>
<!-- Case 3 -->
<rect x="55" y="427" width="1210" height="121" rx="16" fill="#24302f" stroke="#c3925e" stroke-width="1.6"/>
<rect x="78" y="448" width="185" height="78" rx="12" fill="#513e2a"/>
<text class="case" x="96" y="476">CASE 3</text>
<text class="dim" x="96" y="502">Load-use</text>
<rect x="306" y="447" width="326" height="81" rx="11" fill="#3b382c"/>
<text class="code" x="326" y="476">Memory read in MEM</text>
<text class="text" x="326" y="503">stall_MEM = 1</text>
<path d="M647 489H797" stroke="#f4b875" stroke-width="3.2" marker-end="url(#arr)"/>
<rect x="814" y="447" width="400" height="81" rx="11" fill="#333c36"/>
<text class="case" x="836" y="478">Hold 1 cycle, then forward MOUT</text>
<text class="dim" x="836" y="508">Includes load → store-data hazards</text>
<!-- Control row -->
<rect x="55" y="574" width="1210" height="111" rx="16" fill="#142b43" stroke="#4c7591" stroke-width="1.8"/>
<text class="case" x="80" y="610">BR / BRL / J / JL</text>
<text class="text" x="80" y="645">Decode detects INST_M opcode</text>
<path d="M493 625H586" stroke="#7dd9ce" stroke-width="3" marker-end="url(#arr)"/>
<rect x="610" y="597" width="256" height="59" rx="12" fill="#1b4451"/>
<text class="case" x="739" y="635" text-anchor="middle">stall_ID: 1 → 2 → 0</text>
<path d="M882 625H962" stroke="#7dd9ce" stroke-width="3" marker-end="url(#arr)"/>
<text class="text" x="978" y="613">Hold fetch/decode</text>
<text class="dim" x="978" y="641">until target is ready</text>
<text class="foot" x="56" y="712">Conditions summarized from the 2024 report; these are control decisions, not measured performance figures.</text>
</svg>
