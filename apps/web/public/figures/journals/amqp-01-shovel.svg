<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="555" viewBox="0 0 1120 555" role="img" aria-label="Shovel on-confirm: two acknowledgement boundaries"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="553" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Shovel on-confirm: two acknowledgement boundaries</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Illustrative AMQP transfer; message identity is stable</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Source broker</text><text x="420" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Shovel</text><text x="790" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Destination broker</text><rect x="40" y="155" width="290" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="185.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Unacked delivery</text><text x="185.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Message M</text><rect x="405" y="155" width="290" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="550.0" y="200.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Publish M</text><rect x="770" y="155" width="310" height="76" rx="7" fill="#e0eee4" stroke="#a9bbc9"/><text x="925.0" y="184" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Accept publication</text><text x="925.0" y="209" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Message M</text><path d="M330 193H405" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><path d="M695 193H770" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="280" width="290" height="76" rx="7" fill="#e3edf6" stroke="#a9bbc9"/><text x="550.0" y="325.0" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Confirm received</text><path d="M925 231V318H695" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="280" width="290" height="76" rx="7" fill="#f4e8ce" stroke="#a9bbc9"/><text x="185.0" y="309" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#253c51">Source Ack</text><text x="185.0" y="334" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#5e7387">Not yet received</text><path d="M405 318H330" fill="none" stroke="#7793a8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="400" width="1040" height="104" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="433" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Failure window: source connection closes before Ack arrives.</text><text x="60" y="465" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253c51">Redelivery + republish can create a second destination copy.</text><text x="40" y="538" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">Conceptual example · not a historical packet trace</text></svg>
