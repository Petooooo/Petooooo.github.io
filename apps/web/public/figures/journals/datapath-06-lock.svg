<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="607" viewBox="0 0 1120 607" role="img" aria-label="Unlinking a lock file can split the lock domain"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7793a8"/></marker></defs><rect x="1" y="1" width="1118" height="605" rx="7" fill="#fff" stroke="#d0dce5"/><text x="40" y="48" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" fill="#253c51">Unlinking a lock file can split the lock domain</text><text x="40" y="79" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#5e7387">Actual temporary-file flock experiment; no real xtables lock accessed</text><text x="40" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Step</text><text x="360" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Original inode A</text><text x="750" y="132" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#253c51">Recreated inode B</text><rect x="40" y="155" width="1040" height="66" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#253c51">1. Two independent opens</text><text x="360" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">First holds; second blocked</text><text x="750" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">Not created</text><rect x="40" y="232" width="1040" height="66" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#253c51">2. Unlink and recreate</text><text x="360" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">First lock remains held</text><text x="750" y="273" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">New lock succeeds</text><rect x="40" y="309" width="1040" height="66" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="350" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#253c51">3. Independent lock attempt</text><text x="360" y="350" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">Second remains blocked</text><text x="750" y="350" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">Other open blocked</text><rect x="40" y="386" width="1040" height="66" rx="5" fill="#f2f6fa" stroke="#c4d3df"/><text x="55" y="427" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#253c51">4. Release original lock</text><text x="360" y="427" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">Second now succeeds</text><text x="750" y="427" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#253c51">Still independently held</text><rect x="40" y="491" width="1040" height="64" rx="7" fill="#f6dfda" stroke="#d1a69d"/><text x="60" y="530" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#253c51">Same pathname does not guarantee the same inode or lock domain.</text><text x="40" y="590" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#5e7387">All contention and release assertions passed</text></svg>
