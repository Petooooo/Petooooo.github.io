<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Pod IP routing and ClusterIP translation</title><desc id="chart-desc">Direct Pod routing and virtual-Service translation are different paths</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8" stroke="#8bd0dc" stroke-width="1.8" fill="none"/></marker><pattern id="nodes" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30495d"/></pattern></defs><rect width="1500" height="840" rx="20" fill="#091522"/><text x="42" y="59" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="31" font-weight="740" text-anchor="start" fill="#f1f8fc">Pod IP routing and ClusterIP translation</text><text x="42" y="98" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#a4c1d2">Direct Pod routing and virtual-Service translation are different paths</text><path d="M42 121H1458" stroke="#355265" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="38" y="159" width="1424" height="570" rx="17" fill="#102437" stroke="#365366" stroke-width="1.6"/><text x="68" y="196" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#e5f4f7">SOURCE POD</text><circle cx="168" cy="372" r="72" fill="#1d5763" stroke="#76d0c2" stroke-width="3"/><text x="168" y="360" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#ebfff9">Client</text><text x="168" y="387" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#c4e4dd">Pod</text><text x="66" y="526" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#bcd1df">Same source;</text><text x="66" y="548" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#bcd1df">two destinations</text><rect x="318" y="218" width="1083" height="188" rx="13" fill="#152b3f" stroke="#426786" stroke-width="1.6"/><text x="347" y="252" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#8ed1f3">DIRECT POD IP</text><text x="347" y="280" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#a7c5d9">Destination already names a real endpoint</text><rect x="628" y="295" width="265" height="77" rx="10" fill="#245064" stroke="#6babc1" stroke-width="1.6"/><text x="761" y="327" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#e3f4fb">Pod routing / overlay</text><text x="761" y="353" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="middle" fill="#a8d8e5">Flannel if cross-node</text><circle cx="1240" cy="330" r="62" fill="#245853" stroke="#8addb9" stroke-width="2"/><text x="1240" y="322" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#eefff9">Backend</text><text x="1240" y="346" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#d0eee4">Pod</text><path d="M234 336C290 270 329 329 618 332" stroke="#75c9e4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M896 333L1171 333" stroke="#75c9e4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="318" y="420" width="1083" height="214" rx="13" fill="#173040" stroke="#4c806f" stroke-width="1.6"/><text x="347" y="457" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#88e0c3">CLUSTERIP SERVICE</text><text x="347" y="483" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b3d8ce">Virtual destination needs proxy translation, then backend Pod routing</text><circle cx="544" cy="562" r="47" fill="#2b6557" stroke="#8ce0c0" stroke-width="2"/><text x="544" y="554" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#f0fff5">ClusterIP</text><text x="544" y="576" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#c6ebd8">virtual</text><rect x="710" y="526" width="260" height="73" rx="11" fill="#345346" stroke="#8bd8a8" stroke-width="1.6"/><text x="840" y="555" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#eafff2">Service proxy</text><text x="840" y="580" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#c4e9d4">endpoint selection / DNAT</text><rect x="1050" y="526" width="280" height="73" rx="11" fill="#244c5d" stroke="#79acc5" stroke-width="1.6"/><text x="1190" y="556" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#e6f5fb">Backend route</text><text x="1190" y="581" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#bcdbeb">Pod IP after rewrite</text><path d="M234 413C302 496 367 560 492 561" stroke="#7bd9ba" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M597 562L703 562" stroke="#7bd9ba" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M973 562L1043 562" stroke="#7bd9ba" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1330 562H1356V419H1240V395" stroke="#7bd9ba" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1382 646V683H251V657" stroke="#e5bc7e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" /><text x="800" y="703" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#e7cb9b">Return traffic: conntrack, filtering and route symmetry can matter</text><text x="65" y="770" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#bad7e6">The absence of a Service-CIDR route is not by itself a failure: the virtual-IP path is not ordinary Pod routing.</text><path d="M42 780H1458" stroke="#355265" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="812" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#a9c0cc">Conceptual iptables-mode Service datapath. No real addresses, topology or successful incident probes are represented.</text></svg>