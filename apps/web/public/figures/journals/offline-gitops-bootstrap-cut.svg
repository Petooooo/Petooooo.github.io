<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">The registry recovery paradox</title><desc id="chart-desc">A private registry can become a missing prerequisite for recreating itself</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8" fill="none" stroke="#7fc9dc" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="1500" height="860" rx="19" fill="#081522" stroke="#081522" stroke-width="0"/><text x="45" y="59" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="31" font-weight="750" text-anchor="start" fill="#f1f8ff">The registry recovery paradox</text><text x="45" y="99" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#adc6d6">A private registry can become a missing prerequisite for recreating itself</text><path d="M45 125H1455" stroke="#355166" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="159" width="676" height="606" rx="18" fill="#102535" stroke="#35586a" stroke-width="1.5"/><rect x="776" y="159" width="676" height="606" rx="18" fill="#102535" stroke="#35586a" stroke-width="1.5"/><text x="80" y="201" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="23" font-weight="730" text-anchor="start" fill="#efb7a0">FRAGILE SELF-DEPENDENCY</text><text x="806" y="201" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="23" font-weight="730" text-anchor="start" fill="#98e1c4">INDEPENDENT RECOVERY INPUT</text><text x="80" y="234" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#afcbd9">The registry cannot supply its own recovery image</text><text x="806" y="234" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#afcbd9">Proposed architecture breaks a single dependency</text><circle cx="373" cy="329" r="83" fill="#4d343f" stroke="#db8596" stroke-width="2.5"/><text x="373" y="327" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffecf0">REGISTRY</text><text x="373" y="352" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="450" text-anchor="middle" fill="#e7c4cf">unavailable</text><circle cx="213" cy="572" r="83" fill="#493943" stroke="#b58a9b" stroke-width="2.5"/><text x="213" y="570" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffecf0">IMAGE PULL</text><text x="213" y="595" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="450" text-anchor="middle" fill="#e7c4cf">blocked</text><circle cx="537" cy="574" r="83" fill="#453841" stroke="#ad8296" stroke-width="2.5"/><text x="537" y="572" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffecf0">REGISTRY POD</text><text x="537" y="597" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="450" text-anchor="middle" fill="#e7c4cf">needs recreate</text><path d="M306 383Q208 418 207 485" stroke="#d797a1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M297 580H442" stroke="#d797a1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M552 488Q531 402 440 365" stroke="#d797a1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="125" y="431" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="520" text-anchor="start" fill="#e5b3bc">serve layers?</text><text x="375" y="616" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#e4b9c2">cannot start</text><text x="600" y="427" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="520" text-anchor="end" fill="#e5b3bc">needs image</text><rect x="144" y="688" width="476" height="49" rx="11" fill="#49313c" stroke="#a87383" stroke-width="1.5"/><text x="381" y="720" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#f8dae3">No independent image source in the cycle</text><circle cx="1120" cy="326" r="89" fill="#225b4b" stroke="#82d4ad" stroke-width="2.5"/><text x="1120" y="322" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="740" text-anchor="middle" fill="#edfff5">BOOTSTRAP</text><text x="1120" y="348" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#c0e8d2">image source</text><circle cx="932" cy="567" r="75" fill="#205263" stroke="#7fc4d3" stroke-width="2.5"/><text x="932" y="561" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="730" text-anchor="middle" fill="#edf9fd">NODE</text><text x="932" y="585" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#b7dbe6">runtime</text><circle cx="1303" cy="565" r="80" fill="#235a4d" stroke="#79cea9" stroke-width="2.5"/><text x="1303" y="563" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="740" text-anchor="middle" fill="#ecfff1">REGISTRY</text><text x="1303" y="589" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#bce8d3">restored</text><path d="M1056 391Q967 438 940 487" stroke="#84d5b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1008 566H1219" stroke="#80ccd5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1304 487Q1281 429 1193 385" stroke="#80d0b1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><text x="822" y="448" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#b6e7d0">trusted seed</text><text x="1115" y="546" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="570" text-anchor="middle" fill="#bedde7">recover</text><text x="1385" y="454" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#b6e7d0">general images</text><rect x="850" y="688" width="512" height="49" rx="11" fill="#20463d" stroke="#558f78" stroke-width="1.5"/><text x="1106" y="720" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="620" text-anchor="middle" fill="#dafae8">Design direction, not a completed failure drill</text><path d="M45 801H1455" stroke="#355166" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="829" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#b2c6d3">Conceptual dependency graph, not a deployed topology. An independent recovery image source was evaluated, not fully tested.</text></svg>