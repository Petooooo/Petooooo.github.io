" y="223" width="118" height="55" rx="7" fill="#285671"/><text x="532" y="256" text-anchor="middle">Max pool</text><rect x="338" y="290" width="253" height="54" rx="7" fill="#23506b"/><text x="465" y="320" text-anchor="middle">Software control</text><path class="arr" d="M270 235H314"/><path class="arr" d="M617 235H675"/><text x="640" y="216" text-anchor="middle" class="sub">AXI4-Lite</text><rect x="694" y="98" width="313" height="295" rx="12" fill="#183a35" stroke="#4cad9a" class="box"/><text x="713" y="136" class="part">Programmable logic (PL)</text><rect x="713" y="155" width="276" height="54" rx="7" fill="#28645b"/><text x="851" y="186" text-anchor="middle">Input BRAM banks</text><path class="arr" d="M851 212V232"/><rect x="713" y="241" width="276" height="53" rx="7" fill="#28645b"/><text x="851" y="273" text-anchor="middle">BRAM controller / FSM</text><path class="arr" d="M851 299V314"/><rect x="713" y="321" width="276" height="54" rx="7" fill="#21846c"/><text x="851" y="352" text-anchor="middle">Shift-based systolic PE array</text></svg>