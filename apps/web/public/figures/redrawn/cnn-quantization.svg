<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 673" role="img" aria-label="Quantization for shift-based convolution"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#69d2ec" stroke-width="1.8"/></marker></defs><rect width="1200" height="673" rx="18" fill="#0b1220"/><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;letter-spacing:-.01em}</style><text x="42" y="57" font-size="30" fill="#edf5fc" font-weight="750" >Quantization for shift-based convolution</text><text x="42" y="89" font-size="17" fill="#a9bfce" font-weight="400" >Source poster: FP32 training, power-of-two weight mapping, and straight-through gradients</text><line x1="42" y1="112" x2="1158" y2="112" stroke="#40566c" stroke-width="1" /><rect x="48" y="188" width="252" height="118" rx="13" fill="#172638" stroke="#69d2ec" stroke-width="1.5"/><text x="68" y="225" font-size="20" fill="#edf5fc" font-weight="650" >FP32 weights</text><text x="68" y="252" font-size="15" fill="#a9bfce" font-weight="450" >Model training</text><line x1="302" y1="247" x2="369" y2="247" stroke="#69d2ec" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="379" y="188" width="287" height="118" rx="13" fill="#172638" stroke="#f1c97b" stroke-width="1.5"/><text x="399" y="225" font-size="20" fill="#edf5fc" font-weight="650" >Power-of-two</text><text x="399" y="252" font-size="15" fill="#a9bfce" font-weight="450" >Quantizer · INT4 weights</text><line x1="674" y1="247" x2="739" y2="247" stroke="#69d2ec" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="748" y="188" width="395" height="118" rx="13" fill="#172638" stroke="#73dcb5" stroke-width="1.5"/><text x="768" y="225" font-size="20" fill="#edf5fc" font-weight="650" >Shift-friendly weights</text><text x="768" y="252" font-size="15" fill="#a9bfce" font-weight="450" >Signed 2^p factors</text><rect x="70" y="378" width="488" height="173" rx="16" fill="#1c3144" stroke="#40